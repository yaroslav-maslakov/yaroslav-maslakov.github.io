<script>

    /*

    const SUPABASE_URL =
        "https://jtplvfweyguheyqyewal.supabase.co";

    const SUPABASE_KEY =

    const { createClient } =

    const client =

    async function checkSession() {

        const {
            data: {
                session
            }
        } = await client.auth.getSession();

        if (!session) {

            window.location.href =
                "../index.html";

            return;

        }

    }


    /*
     * =========================
     * ВИХІД
     * =========================
     */

    const logoutButton =
        document.getElementById(

        );

    if (logoutButton) {

        logoutButton.addEventListener(
            "click",
            async function() {

                await client.auth.signOut();

                window.location.href =
                    "../index.html";

            }
        );

    }


    /*
     * =========================
     * МОБІЛЬНЕ МЕНЮ

    const adminMenuButton =

        adminMenuButton &&
        adminMenu

        adminMenuButton.addEventListener(

                const isOpen =

                adminMenuButton.textContent =
                    isOpen

                adminMenuButton.setAttribute(
                    "aria-label",

    }

async function uploadArticleImage(
    quillEditor
) {

    const input =
        document.createElement(
            "input"
        );

    input.type = "file";
    input.accept =
        "image/jpeg,image/png,image/webp,image/svg+xml";

    input.click();

    input.addEventListener(
        "change",
        async function() {

            const file =
                input.files[0];

            if (!file) {
                return;
            }

            const fileExtension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            const fileName =
                `${Date.now()}-${Math.random()
                    .toString(36)
                    .substring(2)}.${fileExtension}`;

            const filePath =
                `articles/${fileName}`;

console.log(
    "Файл:",
    file.name,
    "Тип:",
    file.type,
    "Розмір:",
    file.size
);
            
            const {
    error: uploadError
} =
    await client.storage
        .from("article-images")
        .upload(
            filePath,
            file
        );

            if (uploadError) {

                alert(
                    "Не вдалося завантажити зображення."
                );

                console.error(
                    uploadError
                );

                return;
            }

            const {
                data
            } =
                client.storage
                    .from("article-images")
                    .getPublicUrl(
                        filePath
                    );

            const imageUrl =
                data.publicUrl;

            const range =
                quillEditor.getSelection(
                    true
                );

            quillEditor.insertEmbed(
                range.index,
                "image",
                imageUrl
            );

            quillEditor.setSelection(
                range.index + 1
            );

        }
    );

}
    
const articleEditorUA =

        "articleEditorUA"

let articleQuillUA = null;

if (articleEditorUA) {

    articleQuillUA =
        new Quill(

                modules: {
                    toolbar: [

                                    false
                                ]
                            }
                        ],
                        [

                            "italic",
                            "underline"
                        ],

                            },

                            }
                        ],

                            "blockquote"
                        ],
                        [
    "link",
    "image"
],

                        ]

}

    const toolbarUA =

toolbarUA.addHandler(

);

const articleEditorEN =
    document.getElementById(
        "articleEditorEN"

let articleQuillEN = null;

if (articleEditorEN) {

    articleQuillEN =

                theme: "snow",

                modules: {

],

    articleQuillEN.getModule(

toolbarEN.addHandler(

    /*
     * =========================
     * СТВОРЕННЯ СТАТТІ

     */

    const createArticleButton =

        );

    const cancelArticleButton =

        );

    const articleForm =

    if (
        createArticleButton &&
        articleForm

    if (

        articleForm

        cancelArticleButton.addEventListener(

            function() {

                articleForm.style.display =
                    "none";

            }
        );

    }

    /*
 * =========================
 * ЗБЕРЕЖЕННЯ СТАТТІ
 * =========================
 */

const saveArticleButton =
    document.getElementById(
        "saveArticleButton"
    );


if (saveArticleButton) {

    saveArticleButton.addEventListener(
        "click",
        async function() {

            const titleUA =
                document.getElementById(
                    "titleUA"
                ).value.trim();

            const titleEN =
                document.getElementById(
                    "titleEN"
                ).value.trim();

            const category =
                document.getElementById(
                    "category"
                ).value;

            const publicationDate =
                document.getElementById(
                    "publicationDate"
                ).value;

            const status =
                document.getElementById(
                    "articleStatus"
                ).value;

            const excerptUA =
                document.getElementById(
                    "excerptUA"
                ).value.trim();

            const excerptEN =
                document.getElementById(
                    "excerptEN"
                ).value.trim();

            const captionUA =
                document.getElementById(
                    "captionUA"
                ).value.trim();

            const captionEN =
                document.getElementById(
                    "captionEN"
                ).value.trim();

            const author =
                document.getElementById(
                    "author"
                ).value.trim();

            const slug =
                document.getElementById(
                    "slug"
                ).value.trim();


            const contentUA =
                articleQuillUA
                    ? articleQuillUA.root.innerHTML
                    : "";

            const contentEN =
                articleQuillEN
                    ? articleQuillEN.root.innerHTML
                    : "";


            /*
             * ПЕРЕВІРКА ОБОВ'ЯЗКОВИХ ПОЛІВ
             */

            if (
                !titleUA ||
                !titleEN ||
                !category ||
                !publicationDate ||
                !excerptUA ||
                !excerptEN ||
                !contentUA ||
                !contentEN
            ) {

                alert(
                    "Заповніть усі обов'язкові поля."
                );

                return;

            }


            /*
             * БЛОКУЄМО КНОПКУ НА ЧАС ЗБЕРЕЖЕННЯ
             */

            saveArticleButton.disabled =
                true;

            saveArticleButton.textContent =
                "ЗБЕРІГАЄМО...";


            try {

                /*
                 * ЗБЕРЕЖЕННЯ ОСНОВНОЇ СТАТТІ
                 */

                const {
                    data,
                    error
                } =
                    await client
                        .from("articles")
                        .insert({
                            title_ua:
                                titleUA,

                            title_en:
                                titleEN,

                            category:
                                category,

                            publication_date:
                                publicationDate,

                            status:
                                status,

                            excerpt_ua:
                                excerptUA,

                            excerpt_en:
                                excerptEN,

                            content_ua:
                                contentUA,

                            content_en:
                                contentEN,

                            caption_ua:
                                captionUA ||
                                null,

                            caption_en:
                                captionEN ||
                                null,

                            author:
                                author ||
                                null,

                            slug:
                                slug ||
                                null
                        })
                        .select()
                        .single();


                if (error) {

                    console.error(
                        "Помилка збереження статті:",
                        error
                    );

                    alert(
                        "Не вдалося зберегти статтю."
                    );

                    return;

                }


                console.log(
                    "Статтю створено:",
                    data
                );


                alert(
                    "Статтю успішно збережено."
                );


                /*
                 * ОЧИЩЕННЯ ФОРМИ
                 */

                document.getElementById(
                    "titleUA"
                ).value = "";

                document.getElementById(
                    "titleEN"
                ).value = "";

                document.getElementById(
                    "category"
                ).value = "";

                document.getElementById(
                    "publicationDate"
                ).value = "";

                document.getElementById(
                    "articleStatus"
                ).value = "draft";

                document.getElementById(
                    "excerptUA"
                ).value = "";

                document.getElementById(
                    "excerptEN"
                ).value = "";

                document.getElementById(
                    "captionUA"
                ).value = "";

                document.getElementById(
                    "captionEN"
                ).value = "";

                document.getElementById(
                    "author"
                ).value = "";

                document.getElementById(
                    "slug"
                ).value = "";

                document.getElementById(
                    "mainImage"
                ).value = "";


                if (articleQuillUA) {

                    articleQuillUA.setContents([]);

                }


                if (articleQuillEN) {

                    articleQuillEN.setContents([]);

                }


            } catch (error) {

                console.error(
                    "Непередбачена помилка:",
                    error
                );

                alert(
                    "Сталася помилка під час збереження статті."
                );

            } finally {

                saveArticleButton.disabled =
                    false;

                saveArticleButton.textContent =
                    "ЗБЕРЕГТИ СТАТТЮ";

            }

        }
    );

}


    /*
 * =========================
 * ЗАВАНТАЖЕННЯ СТАТЕЙ
 * =========================
 */

const articlesList =
    document.getElementById(
        "articlesList"
    );


async function loadArticles() {

    if (!articlesList) {
        return;
    }


    articlesList.innerHTML =
        "<p>Завантаження статей...</p>";


    const {
        data,
        error
    } =
        await client
            .from("articles")
            .select("*")
            .order(
                "publication_date",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Помилка завантаження статей:",
            error
        );

        articlesList.innerHTML =
            "<p>Не вдалося завантажити статті.</p>";

        return;

    }


    if (!data || data.length === 0) {

        articlesList.innerHTML =
            "<p>Статей поки немає.</p>";

        return;

    }


    articlesList.innerHTML = "";


    data.forEach(
        function(article) {

            const articleItem =
                document.createElement(
                    "div"
                );

            articleItem.className =
                "admin-article-item";


            const title =
                document.createElement(
                    "h4"
                );

            title.textContent =
                article.title_ua;


            const category =
                document.createElement(
                    "p"
                );

            category.textContent =
                "Категорія: " +
                article.category;


            const date =
                document.createElement(
                    "p"
                );

            date.textContent =
                "Дата: " +
                article.publication_date;


            const status =
                document.createElement(
                    "p"
                );

            status.textContent =
                "Статус: " +
                (
                    article.status ===
                    "published"
                        ? "Опубліковано"
                        : "Чернетка"
                );


            articleItem.appendChild(
                title
            );

            articleItem.appendChild(
                category
            );

            articleItem.appendChild(
                date
            );

            articleItem.appendChild(
                status
            );


            articlesList.appendChild(
                articleItem
            );

        }
    );

}
    
    /*
     * =========================
     * ЗАПУСК
     * =========================
     */
    checkSession();

    loadArticles();

</script>
