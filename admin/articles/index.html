async function uploadArticleImage(
    quillEditor
) {

    const input =
        document.createElement(
            "input"
        );

    input.type = "file";
    input.accept =
        "image/jpeg,image/png,image/webp,image/svg+xml";

    input.click();

    input.addEventListener(
        "change",
        async function() {

            const file =
                input.files[0];

            if (!file) {
                return;
            }

            const fileExtension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            const fileName =
                `${Date.now()}-${Math.random()
                    .toString(36)
                    .substring(2)}.${fileExtension}`;

            const filePath =
                `articles/${fileName}`;

console.log(
    "Файл:",
    file.name,
    "Тип:",
    file.type,
    "Розмір:",
    file.size
);
            
            const {
    error: uploadError
} =
    await client.storage
        .from("article-images")
        .upload(
            filePath,
            file
        );

            if (uploadError) {

                alert(
                    "Не вдалося завантажити зображення."
                );

                console.error(
                    uploadError
                );

                return;
            }

            const {
                data
            } =
                client.storage
                    .from("article-images")
                    .getPublicUrl(
                        filePath
                    );

            const imageUrl =
                data.publicUrl;

            const range =
                quillEditor.getSelection(
                    true
                );

            quillEditor.insertEmbed(
                range.index,
                "image",
                imageUrl
            );

            quillEditor.setSelection(
                range.index + 1
            );

        }
    );

}

const saveArticleButton =
    document.getElementById(
        "saveArticleButton"
    );


if (saveArticleButton) {

    saveArticleButton.addEventListener(
        "click",
        async function() {

            const titleUA =
                document.getElementById(
                    "titleUA"
                ).value.trim();

            const titleEN =
                document.getElementById(
                    "titleEN"
                ).value.trim();

            const category =
                document.getElementById(
                    "category"
                ).value;

            const publicationDate =
                document.getElementById(
                    "publicationDate"
                ).value;

            const status =
                document.getElementById(
                    "articleStatus"
                ).value;

            const excerptUA =
                document.getElementById(
                    "excerptUA"
                ).value.trim();

            const excerptEN =
                document.getElementById(
                    "excerptEN"
                ).value.trim();

            const captionUA =
                document.getElementById(
                    "captionUA"
                ).value.trim();

            const captionEN =
                document.getElementById(
                    "captionEN"
                ).value.trim();

            const slug =
                document.getElementById(
                    "slug"
                ).value.trim();


            const mainImageInput =
                document.getElementById(
                    "mainImage"
                );


            const contentUA =
                articleQuillUA
                    ? articleQuillUA.root.innerHTML
                    : "";

            const contentEN =
                articleQuillEN
                    ? articleQuillEN.root.innerHTML
                    : "";


            /*
             * ПЕРЕВІРКА ОБОВ'ЯЗКОВИХ ПОЛІВ
             */

            if (
                !titleUA ||
                !titleEN ||
                !category ||
                !publicationDate ||
                !excerptUA ||
                !excerptEN ||
                !contentUA ||
                !contentEN
            ) {

                alert(
                    "Заповніть усі обов'язкові поля."
                );

                return;

            }


            saveArticleButton.disabled =
                true;

            saveArticleButton.textContent =
                "ЗБЕРІГАЄМО...";


            try {

                /*
                 * =========================
                 * ЗАВАНТАЖЕННЯ ГОЛОВНОГО ЗОБРАЖЕННЯ
                 * =========================
                 */

                let mainImageUrl = null;


                if (
                    mainImageInput &&
                    mainImageInput.files &&
                    mainImageInput.files.length > 0
                ) {

                    const file =
                        mainImageInput.files[0];


                    const fileExtension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const fileName =
                        `${Date.now()}-${Math.random()
                            .toString(36)
                            .substring(2)}.${fileExtension}`;


                    const filePath =
                        `articles/${fileName}`;


                    const {
                        error:
                            imageUploadError
                    } =
                        await client.storage
                            .from(
                                "article-images"
                            )
                            .upload(
                                filePath,
                                file
                            );


                    if (
                        imageUploadError
                    ) {

                        console.error(
                            "Помилка завантаження головного зображення:",
                            imageUploadError
                        );

                        alert(
                            "Не вдалося завантажити головне зображення."
                        );

                        return;

                    }


                    const {
                        data:
                            imageData
                    } =
                        client.storage
                            .from(
                                "article-images"
                            )
                            .getPublicUrl(
                                filePath
                            );


                    mainImageUrl =
                        imageData.publicUrl;

                }


                /*
                 * =========================
                 * ЗБЕРЕЖЕННЯ СТАТТІ
                 * =========================
                 */

                const {
                    data,
                    error
                } =
                    await client
                        .from("articles")
                        .insert({

                            title_ua:
                                titleUA,

                            title_en:
                                titleEN,

                            category:
                                category,

                            publication_date:
                                publicationDate,

                            status:
                                status,

                            excerpt_ua:
                                excerptUA,

                            excerpt_en:
                                excerptEN,

                            content_ua:
                                contentUA,

                            content_en:
                                contentEN,

                            main_image:
                                mainImageUrl,

                            caption_ua:
                                captionUA ||
                                null,

                            caption_en:
                                captionEN ||
                                null,

                            slug:
                                slug ||
                                null

                        })
                        .select()
                        .single();


                if (error) {

                    console.error(
                        "Помилка збереження статті:",
                        error
                    );

                    alert(
                        "Не вдалося зберегти статтю."
                    );

                    return;

                }


                console.log(
                    "Статтю створено:",
                    data
                );


                alert(
                    "Статтю успішно збережено."
                );


                /*
                 * =========================
                 * ОЧИЩЕННЯ ФОРМИ

                    "titleUA"

                document.getElementById(

                ).value = "";

                document.getElementById(
                    "category"
                ).value = "";

                document.getElementById(
                    "publicationDate"
                ).value = "";

                document.getElementById(
                    "articleStatus"

                document.getElementById(
                    "excerptUA"

                document.getElementById(
                    "excerptEN"
                ).value = "";

                document.getElementById(
                    "captionUA"
                ).value = "";

                document.getElementById(
                    "captionEN"
                ).value = "";

                document.getElementById(
                    "slug"
                ).value = "";

async function loadArticles() {

    if (!articlesList) {
        return;
    }


    articlesList.innerHTML =
        "<p>Завантаження статей...</p>";


    const {
        data,
        error
    } =
        await client
            .from("articles")
            .select("*")
            .order(
                "publication_date",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Помилка завантаження статей:",
            error
        );

        articlesList.innerHTML =
            "<p>Не вдалося завантажити статті.</p>";

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        articlesList.innerHTML =
            "<p>Статей поки немає.</p>";

        return;

    }


    articlesList.innerHTML = "";


    data.forEach(
        function(article) {

            const articleItem =
                document.createElement(
                    "article"
                );

            articleItem.className =
                "admin-item";


            /*
             * =========================

                    ? "none"
                    : "block";
        }
    );

/*
 * =========================
 * ДОПОМІЖНІ ФУНКЦІЇ
 * =========================
 */

function escapeArticleHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeArticleAttribute(
    value
) {

    return escapeArticleHtml(
        value
    );

}


function formatArticleDateTime(
    value
) {

    if (!value) {
        return "—";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleString(
        "uk-UA"
    );

}
