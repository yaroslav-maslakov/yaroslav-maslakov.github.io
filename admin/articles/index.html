<script>

    /*
     * =========================
     * SUPABASE
     * =========================
     */

    const SUPABASE_URL =
        "https://jtplvfweyguheyqyewal.supabase.co";

    const SUPABASE_KEY =
        "скрито";

    const { createClient } =
        supabase;

    const client =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    flowType: "pkce",
                    detectSessionInUrl: true,
                    persistSession: true
                }
            }
        );


    /*
     * =========================
     * ПЕРЕВІРКА АВТОРИЗАЦІЇ
     * =========================
     */

    async function checkSession() {

        const {
            data: {
                session
            }
        } = await client.auth.getSession();

        if (!session) {

            window.location.href =
                "../index.html";

            return;

        }

    }


    /*
     * =========================
     * ВИХІД
     * =========================
     */

    const logoutButton =
        document.getElementById(
            "logoutButton"
        );

    if (logoutButton) {

        logoutButton.addEventListener(
            "click",
            async function() {

                await client.auth.signOut();

                window.location.href =
                    "../index.html";

            }
        );

    }


    /*
     * =========================
     * МОБІЛЬНЕ МЕНЮ
     * =========================
     */

    const adminMenuButton =
        document.querySelector(
            ".menu-toggle"
        );

    const adminMenu =
        document.querySelector(
            "nav"
        );

    if (
        adminMenuButton &&
        adminMenu
    ) {

        adminMenuButton.addEventListener(
            "click",
            function() {

                const isOpen =
                    adminMenu.classList.toggle(
                        "menu-open"
                    );

                adminMenuButton.textContent =
                    isOpen
                        ? "ЗАКРИТИ"
                        : "МЕНЮ";

                adminMenuButton.setAttribute(
                    "aria-label",
                    isOpen
                        ? "Закрити меню"
                        : "Відкрити меню"
                );

            }
        );

    }

async function uploadArticleImage(
    quillEditor
) {

    const input =
        document.createElement(
            "input"
        );

    input.type = "file";
    input.accept =
        "image/jpeg,image/png,image/webp,image/svg+xml";

    input.click();

    input.addEventListener(
        "change",
        async function() {

            const file =
                input.files[0];

            if (!file) {
                return;
            }

            const fileExtension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            const fileName =
                `${Date.now()}-${Math.random()
                    .toString(36)
                    .substring(2)}.${fileExtension}`;

            const filePath =
                `articles/${fileName}`;

            const {
    error: uploadError
} =
    await client.storage
        .from("article-images")
        .upload(
            filePath,
            file,
            {
                contentType:
                    file.type,
                cacheControl:
                    "3600",
                upsert: false
            }
        );

            if (uploadError) {

                alert(
                    "Не вдалося завантажити зображення."
                );

                console.error(
                    uploadError
                );

                return;
            }

            const {
                data
            } =
                client.storage
                    .from("article-images")
                    .getPublicUrl(
                        filePath
                    );

            const imageUrl =
                data.publicUrl;

            const range =
                quillEditor.getSelection(
                    true
                );

            quillEditor.insertEmbed(
                range.index,
                "image",
                imageUrl
            );

            quillEditor.setSelection(
                range.index + 1
            );

        }
    );

}

],

}
