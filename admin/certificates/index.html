    /*

 */

function getFilteredCertificates() {

    return allCertificates.filter(
        function(certificate) {

            const title =
                (
                    certificate.title ||
                    ""
                ).toLowerCase();


            const organization =
                (
                    certificate.organization ||
                    ""
                ).toLowerCase();


            const searchTitle =
                filterTitle.value
                    .trim()
                    .toLowerCase();


            const searchOrganization =
                filterOrganization.value
                    .trim()
                    .toLowerCase();


            if (
                searchTitle &&
                !title.includes(
                    searchTitle
                )
            ) {
                return false;
            }


            if (
                searchOrganization &&
                !organization.includes(
                    searchOrganization
                )
            ) {
                return false;
            }


            if (
                filterDateFrom.value &&
                certificate.certificate_date <
                filterDateFrom.value
            ) {
                return false;
            }


            if (
                filterDateTo.value &&
                certificate.certificate_date >
                filterDateTo.value
            ) {
                return false;
            }


            if (
                filterPublished.value ===
                "published" &&
                !certificate.published
            ) {
                return false;
            }


            if (
                filterPublished.value ===
                "draft" &&
                certificate.published
            ) {
                return false;
            }


            if (
                filterHours.value &&
                (
                    certificate.hours === null ||
                    Number(certificate.hours) <
                    Number(filterHours.value)
                )
            ) {
                return false;
            }


            if (
                filterEcts.value &&
                (
                    certificate.ects === null ||
                    Number(certificate.ects) <
                    Number(filterEcts.value)
                )
            ) {
                return false;
            }


            return true;

        }
    );

}


    function renderCertificates(certificateList) {
    certificates.innerHTML = "";

    if (!certificateList || certificateList.length === 0) {
        certificates.textContent = "За заданими фільтрами сертифікатів не знайдено.";

        if (exportCount) {
            exportCount.textContent = " (0)";
        }

        return;
    }

    certificateList.forEach(function(certificate) {
        const item = document.createElement("div");
        item.className = "certificate-card";
        item.dataset.certificateId = certificate.id;

        const title = document.createElement("h3");
        title.textContent = certificate.title;

        const organization = document.createElement("p");
        organization.textContent = certificate.organization;

        const date = document.createElement("p");

        if (certificate.certificate_date) {
            const formattedDate = new Date(
                certificate.certificate_date + "T00:00:00"
            ).toLocaleDateString("uk-UA");

            date.textContent = "Дата: " + formattedDate;
        } else {
            date.textContent = "Дата: —";
        }

        const details = document.createElement("p");

        const hoursText =
            certificate.hours !== null &&
            certificate.hours !== undefined
                ? certificate.hours + " год."
                : "—";

        const ectsText =
            certificate.ects !== null &&
            certificate.ects !== undefined
                ? certificate.ects + " ЄКТС"
                : "—";

        details.textContent =
            "Обсяг: " + hoursText + " · " + ectsText;

        const status = document.createElement("p");
        status.className = "certificate-status";
        status.textContent = certificate.published
            ? "Статус: опубліковано"
            : "Статус: чернетка";

        if (certificate.file_url) {
            const fileLink = document.createElement("a");
            fileLink.href = certificate.file_url;
            fileLink.target = "_blank";
            fileLink.rel = "noopener noreferrer";
            fileLink.textContent = "ВІДКРИТИ PDF →";

            item.appendChild(fileLink);
        }

        const publishLabel = document.createElement("label");
        publishLabel.className = "checkbox-label";

        const publishToggle = document.createElement("input");
        publishToggle.type = "checkbox";
        publishToggle.checked = certificate.published;

        const publishText = document.createElement("span");
        publishText.textContent = "Опубліковано";

        publishLabel.appendChild(publishToggle);
        publishLabel.appendChild(publishText);

        publishToggle.addEventListener("change", async function() {
            const { error } = await client
                .from("certificates")
                .update({
                    published: publishToggle.checked
                })
                .eq("id", certificate.id);

            if (error) {
                alert("Не вдалося змінити статус: " + error.message);
                publishToggle.checked = certificate.published;
                return;
            }

            certificate.published = publishToggle.checked;
            status.textContent = certificate.published
                ? "Статус: опубліковано"
                : "Статус: чернетка";

            updateExportCount();
        });

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.textContent = "РЕДАГУВАТИ";

        editButton.addEventListener("click", function() {
        const card = editButton.closest(".certificate-card");

        if (!card) return;

        card.classList.add("editing");
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "ВИДАЛИТИ";

        deleteButton.addEventListener("click", async function() {
            const confirmed = confirm(
                "Видалити цей сертифікат?"
            );

            if (!confirmed) {
                return;
            }

            const { error } = await client
                .from("certificates")
                .delete()
                .eq("id", certificate.id);

            if (error) {
                alert(
                    "Не вдалося видалити сертифікат: " +
                    error.message
                );
                return;
            }

            if (editingCertificateId === certificate.id) {
                clearForm();
                certificateFormContainer.style.display = "none";
            }

            await loadCertificates();
        });

        item.appendChild(title);
        item.appendChild(organization);
        item.appendChild(date);
        item.appendChild(details);
        item.appendChild(status);
        item.appendChild(publishLabel);

        const buttons = document.createElement("div");
        buttons.className = "admin-form-buttons";

        buttons.appendChild(editButton);
        buttons.appendChild(deleteButton);

        item.appendChild(buttons);

        certificates.appendChild(item);
    });

    updateExportCount();
}

    async function loadCertificates() {


        certificates.textContent =
            "Завантаження...";


        const {
            data,
            error
        } =
            await client
                .from("certificates")
                .select("*")
                .order(
                    "certificate_date",
                    {
                        ascending: false
                    }
                );


        if (error) {

            certificates.textContent =
                "Помилка завантаження: " +
                error.message;

            return;

        }

        allCertificates = data || [];


if (
    !data ||
    data.length === 0
) {

    certificates.textContent =
        "Сертифікатів поки немає.";

    return;

}


renderCertificates(
    allCertificates
);
}

    certificateForm.addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            formMessage.textContent =
                "Збереження...";


            const title =
                document.getElementById(
                    "title"
                ).value.trim();


            const organization =
                document.getElementById(
                    "organization"
                ).value.trim();


            const certificateDate =
                document.getElementById(
                    "certificate_date"
                ).value;


            const hours =
                document.getElementById(
                    "hours"
                ).value;


            const ects =
                document.getElementById(
                    "ects"
                ).value;


            const description =
                document.getElementById(
                    "description"
                ).value.trim();


            const titleEn =
                document.getElementById(
                    "title_en"
                ).value.trim();


            const organizationEn =
                document.getElementById(
                    "organization_en"
                ).value.trim();


            const descriptionEn =
                document.getElementById(
                    "description_en"
                ).value.trim();


            const published =
                document.getElementById(
                    "published"
                ).checked;


            const file =
                document.getElementById(
                    "certificateFile"
                ).files[0];



            /*
             * =========================
             * РЕЖИМ РЕДАГУВАННЯ
             * =========================
             */

            if (
                editingCertificateId
            ) {


                let fileUrl =
                    editingCertificate.file_url ||
                    null;



                /*
                 * ЯКЩО ВИБРАНО НОВИЙ PDF
                 */

                if (file) {


                    formMessage.textContent =
                        "Завантаження нового PDF...";


                    const fileName =
                        Date.now() +
                        "-" +
                        file.name;


                    const {
                        error: uploadError
                    } =
                        await client
                            .storage
                            .from(
                                "certificates"
                            )
                            .upload(
                                fileName,
                                file
                            );


                    if (uploadError) {


                        formMessage.textContent =
                            "Помилка завантаження PDF: " +
                            uploadError.message;


                        return;

                    }


                    const {
                        data:
                            publicUrlData
                    } =
                        client
                            .storage
                            .from(
                                "certificates"
                            )
                            .getPublicUrl(
                                fileName
                            );


                    fileUrl =
                        publicUrlData.publicUrl;

                }



                /*
                 * ОНОВЛЕННЯ ЗАПИСУ
                 */

                const {
                    error
                } =
                    await client
                        .from(
                            "certificates"
                        )
                        .update(
                            {

                                title:
                                    title,

                                organization:
                                    organization,

                                certificate_date:
                                    certificateDate,

                                hours:
                                    hours
                                    ? Number(hours)
                                    : null,

                                ects:
                                    ects
                                    ? Number(ects)
                                    : null,

                                description:
                                    description ||
                                    null,

                                title_en:
                                    titleEn ||
                                    null,

                                organization_en:
                                    organizationEn ||
                                    null,

                                description_en:
                                    descriptionEn ||
                                    null,

                                file_url:
                                    fileUrl,

                                published:
                                    published

                            }
                        )
                        .eq(
                            "id",
                            editingCertificateId
                        );



                if (error) {


                    formMessage.textContent =
                        "Помилка збереження: " +
                        error.message;


                    return;

                }



                formMessage.textContent =
                    "Зміни збережено.";


                clearForm();


                loadCertificates();


                return;

            }



            /*
             * =========================
             * НОВИЙ СЕРТИФІКАТ
             * =========================
             */

            if (!file) {


                formMessage.textContent =
                    "Оберіть PDF-файл.";


                return;

            }



            formMessage.textContent =
                "Завантаження PDF...";


            const fileName =
                Date.now() +
                "-" +
                file.name;



            const {
                error: uploadError
            } =
                await client
                    .storage
                    .from(
                        "certificates"
                    )
                    .upload(
                        fileName,
                        file
                    );


            if (uploadError) {


                formMessage.textContent =
                    "Помилка завантаження PDF: " +
                    uploadError.message;


                return;

            }



            const {
                data:
                    publicUrlData
            } =
                client
                    .storage
                    .from(
                        "certificates"
                    )
                    .getPublicUrl(
                        fileName
                    );


            const fileUrl =
                publicUrlData.publicUrl;



            formMessage.textContent =
                "Збереження сертифіката...";



            const {
                error
            } =
                await client
                    .from(
                        "certificates"
                    )
                    .insert(
                        {

                            title:
                                title,

                            organization:
                                organization,

                            certificate_date:
                                certificateDate,

                            hours:
                                hours
                                ? Number(hours)
                                : null,

                            ects:
                                ects
                                ? Number(ects)
                                : null,

                            description:
                                description ||
                                null,

                            title_en:
                                titleEn ||
                                null,

                            organization_en:
                                organizationEn ||
                                null,

                            description_en:
                                descriptionEn ||
                                null,

                            file_url:
                                fileUrl,

                            published:
                                published

                        }
                    );



            if (error) {


                formMessage.textContent =
                    "Помилка збереження: " +
                    error.message;


                return;

            }



            formMessage.textContent =
                "Сертифікат успішно додано.";


            clearForm();


            loadCertificates();

        }
    );



    /*
     * =========================
     * ОЧИСТИТИ ФОРМУ
     * =========================
     */

    addCertificateButton.addEventListener(
    "click",
    function() {

        certificateFormContainer.style.display =
            "block";

        clearForm();

        certificateFormContainer.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }
);


clearFormButton.addEventListener(
    "click",
    function() {

        clearForm();

        certificateFormContainer.style.display =
            "none";

    }
);


    function clearForm() {


        certificateForm.reset();


        editingCertificateId =
            null;


        editingCertificate =
            null;


        formTitle.textContent =
            "Додати сертифікат";


        saveButton.textContent =
            "ЗБЕРЕГТИ СЕРТИФІКАТ";


        currentFile.style.display =
            "none";


        currentFile.innerHTML =
            "";


        formMessage.textContent =
            "";

    }



    /*
     * =========================
     * ВИХІД
     * =========================
     */

    logoutButton.addEventListener(
        "click",
        async function() {


            await client.auth.signOut();


            window.location.href =
                "../index.html";

        }
    );

   /*
 * =========================
 * ЛІЧИЛЬНИК ЕКСПОРТУ
 * =========================
 */

function updateExportCount() {

    const filteredCertificates =
        getFilteredCertificates();

    if (exportCount) {

        exportCount.textContent =
            " (" + filteredCertificates.length + ")";

    }

}


/*
 * =========================
 * ЗАСТОСУВАННЯ ФІЛЬТРІВ
 * =========================
 */

function applyFilters() {

    const filteredCertificates =
        getFilteredCertificates();

    renderCertificates(
        filteredCertificates
    );

}


applyFiltersButton.addEventListener("click", applyFilters);


clearFiltersButton.addEventListener(
    "click",
    function() {

        filterTitle.value = "";
        filterOrganization.value = "";
        filterDateFrom.value = "";
        filterDateTo.value = "";
        filterPublished.value = "";
        filterHours.value = "";
        filterEcts.value = "";

        applyFilters();

    }
);


/*
 * =========================
 * ЕКСПОРТ XLSX
 * =========================
 */

exportXlsxButton.addEventListener(
    "click",
    function() {

        const certificatesToExport =
            getFilteredCertificates();

        if (
            !certificatesToExport ||
            certificatesToExport.length === 0
        ) {

            alert(
                "Немає сертифікатів для експорту."
            );

            return;

        }


        const exportData =
            certificatesToExport.map(
                function(certificate) {

                    return {

                        "ID":
                            certificate.id,

                        "Назва UA":
                            certificate.title || "",

                        "Організація UA":
                            certificate.organization || "",

                        "Дата":
                            certificate.certificate_date || "",

                        "Години":
                            certificate.hours ?? "",

                        "ЄКТС":
                            certificate.ects ?? "",

                        "Опис UA":
                            certificate.description || "",

                        "Назва EN":
                            certificate.title_en || "",

                        "Організація EN":
                            certificate.organization_en || "",

                        "Опис EN":
                            certificate.description_en || "",

                        "PDF":
                            certificate.file_url || "",

                        "Опубліковано":
                            certificate.published
                                ? "Так"
                                : "Ні",

                        "Створено":
                            certificate.created_at || ""

                    };

                }
            );


        const worksheet =
            XLSX.utils.json_to_sheet(
                exportData
            );


        const workbook =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "Сертифікати"
        );


        XLSX.writeFile(
            workbook,
            "certificates.xlsx"
        );

    }
);


/*
 * =========================
 * ФІЛЬТРИ
 * =========================
 */

filtersToggle.addEventListener(
    "click",
    function() {

        const isOpen =
            filtersPanel.style.display === "block";

        if (isOpen) {

            filtersPanel.style.display = "none";
            filtersArrow.textContent = "＋";

        } else {

            filtersPanel.style.display = "block";
            filtersArrow.textContent = "−";

        }

    }
);


/*
 * =========================
 * ЗАПУСК
 * =========================
 */

checkSession();


</script>
