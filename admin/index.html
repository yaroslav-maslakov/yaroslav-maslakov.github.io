<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Адмін-панель — Ярослав Маслаков</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>
        <div class="header-inner">

            <div class="logo">
                ЯРОСЛАВ МАСЛАКОВ
            </div>

            <div class="language">
                <a href="../uk/index.html">UA</a>
                <span>|</span>
                <a href="../en/index.html">EN</a>
            </div>

        </div>
    </header>


    <main>

        <section class="latest">

            <h2>Адмін-панель</h2>

            <div id="auth">

                <p>
                    Увійдіть, щоб керувати матеріалами сайту.
                </p>

                <form id="loginForm">

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Пароль"
                        required
                    >

                    <button type="submit">
                        УВІЙТИ
                    </button>

                    <button type="button" id="resetPasswordButton">
                        ВІДНОВИТИ ПАРОЛЬ
                    </button>

                </form>

                <p id="message"></p>

            </div>


            <div id="adminPanel" style="display: none;">

                <h3>Сертифікати</h3>

                <button
                    type="button"
                    id="addCertificateButton"
                >
                    ДОДАТИ СЕРТИФІКАТ
                </button>

                <div id="certificates">
                    Завантаження...
                </div>

                <div id="certificateForm" style="display: none;">

    <h3>Новий сертифікат</h3>

    <form id="newCertificateForm">

        <h4>Українська версія</h4>

        <input
            type="text"
            id="title"
            placeholder="Назва сертифіката"
            required
        >

        <input
            type="text"
            id="organization"
            placeholder="Організація"
            required
        >

        <label for="certificate_date">
            Дата отримання
        </label>

        <input
            type="date"
            id="certificate_date"
            required
        >

        <input
            type="number"
            id="hours"
            placeholder="Кількість годин"
            min="0"
            step="0.5"
        >

        <input
            type="number"
            id="ects"
            placeholder="Кредити ЄКТС"
            min="0"
            step="0.1"
        >

        <textarea
            id="description"
            placeholder="Опис сертифіката"
            rows="5"
        ></textarea>


        <h4>English version</h4>

        <input
            type="text"
            id="title_en"
            placeholder="Certificate title"
        >

        <input
            type="text"
            id="organization_en"
            placeholder="Organization"
        >

        <textarea
            id="description_en"
            placeholder="Certificate description"
            rows="5"
        ></textarea>


        <h4>PDF-файл</h4>

        <input
            type="file"
            id="certificateFile"
            accept="application/pdf"
        >


        <label>
            <input
                type="checkbox"
                id="published"
            >

            Опублікувати одразу
        </label>


        <div>

            <button
                type="submit"
            >
                ЗБЕРЕГТИ СЕРТИФІКАТ
            </button>

            <button
                type="button"
                id="cancelCertificateButton"
            >
                СКАСУВАТИ
            </button>

        </div>

        <p id="certificateFormMessage"></p>

    </form>

</div>

                <button id="logoutButton">
                    ВИЙТИ
                </button>

            </div>

        </section>

    </main>


    <footer>
        © 2026 Ярослав Маслаков
    </footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://jtplvfweyguheyqyewal.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_jAg0mG8Pj30tCF7qND3ydQ_-WDv4EhP";


    const { createClient } =
        supabase;


    const client =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                flowType: "pkce",
                detectSessionInUrl: true,
                persistSession: true
            }
        }
    );


    const loginForm =
        document.getElementById("loginForm");

    const auth =
        document.getElementById("auth");

    const adminPanel =
        document.getElementById("adminPanel");

    const message =
        document.getElementById("message");

    const logoutButton =
        document.getElementById("logoutButton");
    
    const resetPasswordButton =
        document.getElementById("resetPasswordButton");


    async function checkSession() {

        const {
            data: {
                session
            }
        } = await client.auth.getSession();


        if (session) {

            auth.style.display = "none";

            adminPanel.style.display = "block";

            loadCertificates();

        }

    }

resetPasswordButton.addEventListener(
    "click",
    async function() {

        const email =
            document.getElementById("email").value;

        if (!email) {

            message.textContent =
                "Спочатку введіть email.";

            return;
        }


        message.textContent =
            "Надсилаємо лист...";


        const { error } =
            await client.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        "https://yaroslav-maslakov.github.io/admin/"
                }
            );


        if (error) {

            message.textContent =
                "Помилка: " + error.message;

            return;
        }


        message.textContent =
            "Лист для відновлення пароля надіслано.";
    }
);
    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            message.textContent = "Вхід...";


            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            const {
                error
            } = await client.auth.signInWithPassword({

                email: email,

                password: password

            });


            if (error) {

                message.textContent =
                    "Помилка входу: " +
                    error.message;

                return;

            }


            auth.style.display = "none";

            adminPanel.style.display = "block";

        }
    );


    logoutButton.addEventListener(
        "click",
        async function() {

            await client.auth.signOut();

            adminPanel.style.display = "none";

            auth.style.display = "block";

            loginForm.reset();

            message.textContent = "";

        }
    );

    const addCertificateButton =
    document.getElementById("addCertificateButton");

const certificateForm =
    document.getElementById("certificateForm");

const cancelCertificateButton =
    document.getElementById("cancelCertificateButton");


addCertificateButton.addEventListener(
    "click",
    function() {

        certificateForm.style.display = "block";

        addCertificateButton.style.display = "none";

    }
);


cancelCertificateButton.addEventListener(
    "click",
    function() {

        certificateForm.style.display = "none";

        addCertificateButton.style.display = "inline-block";

    }
);


    checkSession();
    async function loadCertificates() {

    const certificates =
        document.getElementById("certificates");

    certificates.textContent =
        "Завантаження...";

    const {
        data,
        error
    } = await client
        .from("certificates")
        .select("*")
        .order("certificate_date", {
            ascending: false
        });

    if (error) {

        certificates.textContent =
            "Помилка завантаження: " +
            error.message;

        return;
    }

    if (!data || data.length === 0) {

        certificates.textContent =
            "Сертифікатів поки немає.";

        return;
    }

    certificates.innerHTML = "";

    data.forEach(function(certificate) {

        const item =
            document.createElement("div");

        item.className =
            "certificate-card";

        item.innerHTML = `
            <h3>${certificate.title}</h3>

            <p>
                ${certificate.organization}
            </p>

            <p>
                Дата: ${certificate.certificate_date}
            </p>

            <p>
                Години: ${certificate.hours ?? "—"}
                |
                ЄКТС: ${certificate.ects ?? "—"}
            </p>

            <p>
                Статус:
                ${certificate.published ? "Опубліковано" : "Чернетка"}
            </p>

            ${
                certificate.file_url
                ? `<p>
                    <a
                        href="${certificate.file_url}"
                        target="_blank"
                    >
                        Відкрити сертифікат →
                    </a>
                   </p>`
                : ""
            }
        `;

        certificates.appendChild(item);

    });
}

</script>

</body>
</html>
