<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід в адмінпанель</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-login-page">

    <main class="admin-login">
        <h1>Вхід в адмінпанель</h1>
        <p>Увійдіть, щоб керувати матеріалами сайту.</p>

        <form id="loginForm">
            <label for="email">Електронна пошта</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                placeholder="Ваша електронна пошта"
                required
            >

            <label for="password">Пароль</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Ваш пароль"
                required
            >

            <button type="submit" id="loginButton">Увійти</button>
            <p id="loginMessage" role="alert"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://jtplvfweyguheyqyewal.supabase.co";
        const SUPABASE_KEY = "sb_publishable_jAg0mG8Pj30tCF7qND3ydQ_-WDv4EhP";

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    flowType: "pkce",
                    detectSessionInUrl: true,
                    persistSession: true
                }
            }
        );

        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("loginMessage");

        client.auth.getSession().then(({ data, error }) => {
            if (!error && data.session) {
                window.location.replace("/admin/index.html");
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Входимо...";
            message.textContent = "";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const { error } = await client.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                message.textContent =
                    "Не вдалося увійти. Перевірте пошту та пароль.";
                console.error("Помилка входу:", error);
                button.disabled = false;
                button.textContent = "Увійти";
                return;
            }

            window.location.replace("/admin/index.html");
        });
    </script>
</body>
</html>
