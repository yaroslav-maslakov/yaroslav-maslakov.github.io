<script>


/*

 */

const SUPABASE_URL =
    "https://jtplvfweyguheyqyewal.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jAg0mG8Pj30tCF7qND3ydQ_-WDv4EhP";


const { createClient } =
    supabase;


const client =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY,

            auth: {
                flowType: "pkce",
                detectSessionInUrl: true,
                persistSession: true

/*
 * =========================
 * ПЕРЕВІРКА АВТОРИЗАЦІЇ
 * =========================
 */

async function checkSession() {

    const {
        data: {
            session
        }
    } =
        await client.auth.getSession();


    if (!session) {

        window.location.href =
            "../index.html";

        return;

    }

}



/*
 * =========================
 * ВИХІД
 * =========================
 */

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


if (logoutButton) {

    logoutButton.addEventListener(
        "click",
        async function() {

            await client.auth.signOut();

            window.location.href =
                "../index.html";

        }
    );

}



/*
 * =========================
 * МОБІЛЬНЕ МЕНЮ
 * =========================
 */

const adminMenuButton =
    document.querySelector(
        ".menu-toggle"
    );


const adminMenu =
    document.querySelector(
        "nav"
    );


if (
    adminMenuButton &&
    adminMenu
) {

    adminMenuButton.addEventListener(
        "click",
        function() {

            const isOpen =
                adminMenu.classList.toggle(
                    "menu-open"
                );


            adminMenuButton.textContent =
                isOpen
                    ? "ЗАКРИТИ"
                    : "МЕНЮ";


            adminMenuButton.setAttribute(
                "aria-label",
                isOpen

                    : "Відкрити меню"
            );

        }
    );

}



/*
 * =========================
 * ЗАВАНТАЖЕННЯ ЗОБРАЖЕННЯ
 * У QUILL
 * =========================
 */

async function uploadPublicationImage(
    quillEditor
) {

    const input =
        document.createElement(
            "input"
        );


    input.type = "file";

    input.accept =
        "image/jpeg,image/png,image/webp,image/svg+xml";


    input.click();


    input.addEventListener(
        "change",
        async function() {

            const file =
                input.files[0];


            if (!file) {
                return;
            }


            const fileExtension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const fileName =
                `${Date.now()}-${Math.random()
                    .toString(36)
                    .substring(2)}.${fileExtension}`;


            const filePath =
                `publications/${fileName}`;


            const {
                error: uploadError
            } =
                await client.storage
                    .from("publication-images")
                    .upload(
                        filePath,
                        file
                    );


            if (uploadError) {

                console.error(
                    "Помилка завантаження зображення:",
                    uploadError
                );

                alert(
                    "Не вдалося завантажити зображення."
                );

                return;
            }


            const {
                data
            } =
                client.storage
                    .from("publication-images")
                    .getPublicUrl(
                        filePath
                    );


            const imageUrl =
                data.publicUrl;


            const range =
                quillEditor.getSelection(
                    true
                );


            quillEditor.insertEmbed(
                range.index,
                "image",
                imageUrl
            );


            quillEditor.setSelection(
                range.index + 1
            );

        }
    );

}



/*
 * =========================
 * НАЛАШТУВАННЯ QUILL
 * =========================
 */

function createPublicationQuill(
    element
) {

    return new Quill(
        element,
        {
            theme: "snow",

            modules: {

                toolbar: [

                    [
                        {
                            header: [
                                1,
                                2,
                                3,
                                false
                            ]
                        }
                    ],

                    [
                        "bold",
                        "italic",
                        "underline"
                    ],

                    [
                        {
                            list: "ordered"
                        },

                        {
                            list: "bullet"
                        }
                    ],

                    [
                        "blockquote"
                    ],

                    [
                        "link",
                        "image"
                    ],

                    [
                        {
                            align: []
                        }
                    ],

                    [
                        "clean"
                    ]

                ]

            }

        }
    );

}



/*
 * =========================
 * QUILL — UA
 * =========================
 */

const publicationEditorUA =
    document.getElementById(
        "publicationEditorUA"
    );


let publicationQuillUA =
    null;


if (publicationEditorUA) {

    publicationQuillUA =
        createPublicationQuill(
            publicationEditorUA
        );


    publicationQuillUA
        .getModule("toolbar")
        .addHandler(
            "image",
            function() {

                uploadPublicationImage(
                    publicationQuillUA
                );

            }
        );

}



/*
 * =========================
 * QUILL — EN
 * =========================
 */

const publicationEditorEN =
    document.getElementById(
        "publicationEditorEN"
    );


let publicationQuillEN =
    null;


if (publicationEditorEN) {

    publicationQuillEN =
        createPublicationQuill(
            publicationEditorEN
        );


    publicationQuillEN
        .getModule("toolbar")
        .addHandler(
            "image",
            function() {

                uploadPublicationImage(
                    publicationQuillEN
                );

            }
        );

}



/*
 * =========================
 * СТВОРЕННЯ ПУБЛІКАЦІЇ
 * =========================
 */

const createPublicationButton =
    document.getElementById(
        "createPublicationButton"
    );


const cancelPublicationButton =
    document.getElementById(
        "cancelPublicationButton"
    );


const publicationForm =
    document.getElementById(
        "publicationForm"
    );


if (
    createPublicationButton &&
    publicationForm
) {

    createPublicationButton.addEventListener(
        "click",
        function() {

            publicationForm.style.display =
                "block";


            createPublicationButton.style.display =
                "none";


            window.scrollTo({

                top:
                    publicationForm.offsetTop - 30,

                behavior:
                    "smooth"

            });

        }
    );

}



if (
    cancelPublicationButton &&
    publicationForm
) {

    cancelPublicationButton.addEventListener(
        "click",
        function() {

            publicationForm.style.display =
                "none";


            createPublicationButton.style.display =
                "block";

        }
    );

}



/*
 * =========================
 * ЗБЕРЕЖЕННЯ ПУБЛІКАЦІЇ
 * =========================
 */

const savePublicationButton =
    document.getElementById(
        "savePublicationButton"
    );


if (savePublicationButton) {

    savePublicationButton.addEventListener(
        "click",
        async function() {

            const titleUA =
                document.getElementById(
                    "titleUA"
                ).value.trim();


            const titleEN =
                document.getElementById(
                    "titleEN"
                ).value.trim();


            const publicationType =
                document.getElementById(
                    "publicationType"
                ).value;


            const publicationNameUA =
                document.getElementById(
                    "publicationNameUA"
                ).value.trim();


            const publicationNameEN =
                document.getElementById(
                    "publicationNameEN"
                ).value.trim();


            const publicationDate =
                document.getElementById(
                    "publicationDate"
                ).value;


            const status =
                document.getElementById(
                    "publicationStatus"
                ).value;


            const excerptUA =
                document.getElementById(
                    "excerptUA"
                ).value.trim();


            const excerptEN =
                document.getElementById(
                    "excerptEN"
                ).value.trim();


            const captionUA =
                document.getElementById(
                    "captionUA"
                ).value.trim();


            const captionEN =
                document.getElementById(
                    "captionEN"
                ).value.trim();


            const publicationUrl =
                document.getElementById(
                    "publicationUrl"
                ).value.trim();


            const slug =
                document.getElementById(
                    "slug"
                ).value.trim();


            const mainImageInput =
                document.getElementById(
                    "mainImage"
                );


            const contentUA =
                publicationQuillUA
                    ? publicationQuillUA.root.innerHTML
                    : "";


            const contentEN =
                publicationQuillEN
                    ? publicationQuillEN.root.innerHTML
                    : "";


            if (
                !titleUA ||
                !titleEN ||
                !publicationType ||
                !publicationNameUA ||
                !publicationNameEN ||
                !publicationDate ||
                !excerptUA ||
                !excerptEN ||
                !contentUA ||
                !contentEN
            ) {

                alert(
                    "Заповніть усі обов'язкові поля."
                );

                return;

            }


            savePublicationButton.disabled =
                true;


            savePublicationButton.textContent =
                "ЗБЕРІГАЄМО...";


            try {

                let mainImageUrl =
                    null;


                /*
                 * ГОЛОВНЕ ЗОБРАЖЕННЯ
                 */

                if (
                    mainImageInput &&
                    mainImageInput.files &&
                    mainImageInput.files.length > 0
                ) {

                    const file =
                        mainImageInput.files[0];


                    const fileExtension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const fileName =
                        `${Date.now()}-${Math.random()
                            .toString(36)
                            .substring(2)}.${fileExtension}`;


                    const filePath =
                        `publications/${fileName}`;


                    const {
                        error:
                            imageUploadError
                    } =
                        await client.storage
                            .from(
                                "publication-images"
                            )
                            .upload(
                                filePath,
                                file
                            );


                    if (
                        imageUploadError
                    ) {

                        console.error(
                            "Помилка завантаження головного зображення:",
                            imageUploadError
                        );

                        alert(
                            "Не вдалося завантажити головне зображення."
                        );

                        return;

                    }


                    const {
                        data:
                            imageData
                    } =
                        client.storage
                            .from(
                                "publication-images"
                            )
                            .getPublicUrl(
                                filePath
                            );


                    mainImageUrl =
                        imageData.publicUrl;

                }


                /*
                 * БД
                 */

                const {
                    data,
                    error
                } =
                    await client
                        .from("publications")
                        .insert({

                            title_ua:
                                titleUA,

                            title_en:
                                titleEN,

                            publication_type:
                                publicationType,

                            publication_name_ua:
                                publicationNameUA,

                            publication_name_en:
                                publicationNameEN,

                            publication_date:
                                publicationDate,

                            status:
                                status,

                            excerpt_ua:
                                excerptUA,

                            excerpt_en:
                                excerptEN,

                            content_ua:
                                contentUA,

                            content_en:
                                contentEN,

                            main_image:
                                mainImageUrl,

                            caption_ua:
                                captionUA || null,

                            caption_en:
                                captionEN || null,

                            publication_url:
                                publicationUrl || null,

                            slug:
                                slug || null

                        })
                        .select()
                        .single();


                if (error) {

                    console.error(
                        "Помилка збереження публікації:",
                        error
                    );

                    alert(
                        "Не вдалося зберегти публікацію."
                    );

                    return;

                }


                console.log(
                    "Публікацію створено:",
                    data
                );


                alert(
                    "Публікацію успішно збережено."
                );


                clearPublicationForm();

                await loadPublications();

            } catch (error) {

                console.error(
                    "Непередбачена помилка:",
                    error
                );

                alert(
                    "Сталася помилка під час збереження публікації."
                );

            } finally {

                savePublicationButton.disabled =
                    false;


                savePublicationButton.textContent =
                    "ЗБЕРЕГТИ ПУБЛІКАЦІЮ";

            }

        }
    );

}



/*
 * =========================
 * ОЧИЩЕННЯ ФОРМИ

function clearPublicationForm() {

    document.getElementById(
        "titleUA"
    ).value = "";


    document.getElementById(
        "titleEN"
    ).value = "";


    document.getElementById(
        "publicationType"
    ).value = "";


    document.getElementById(
        "publicationNameUA"
    ).value = "";


    document.getElementById(
        "publicationNameEN"
    ).value = "";


    document.getElementById(
        "publicationDate"
    ).value = "";


    document.getElementById(
        "publicationStatus"
    ).value = "draft";

/*
 * =========================
 * ЗАВАНТАЖЕННЯ ПУБЛІКАЦІЙ
 * =========================
 */

let allPublications =
    [];


let editingPublicationId =
    null;


const publicationList =
    document.getElementById(
        "publicationList"
    );


const publicationCount =
    document.getElementById(
        "publicationCount"
    );


async function loadPublications() {

    if (!publicationList) {
        return;
    }


    publicationList.innerHTML =
        "<p>Завантаження публікацій...</p>";


    const {
        data,
        error
    } =
        await client
            .from("publications")
            .select("*")
            .order(
                "publication_date",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Помилка завантаження публікацій:",
            error
        );


        publicationList.innerHTML =
            "<p>Не вдалося завантажити публікації.</p>";


        return;

    }


    allPublications =
        data || [];


    renderPublications();

}



/*
 * =========================
 * ВІДОБРАЖЕННЯ
 * =========================
 */

function renderPublications() {

    if (!publicationList) {
        return;
    }


    const titleUA =
        document.getElementById(
            "filterTitleUA"
        ).value
            .trim()
            .toLowerCase();


    const titleEN =
        document.getElementById(
            "filterTitleEN"
        ).value
            .trim()
            .toLowerCase();


    const publicationType =
        document.getElementById(
            "filterPublicationType"
        ).value;


    const publicationName =
        document.getElementById(
            "filterPublicationName"
        ).value
            .trim()
            .toLowerCase();


    const dateFrom =
        document.getElementById(
            "filterDateFrom"
        ).value;


    const dateTo =
        document.getElementById(
            "filterDateTo"
        ).value;


    const status =
        document.getElementById(
            "filterStatus"
        ).value;


    const filteredPublications =
        allPublications.filter(
            function(publication) {

                const publicationTitleUA =
                    String(
                        publication.title_ua || ""
                    ).toLowerCase();


                const publicationTitleEN =
                    String(
                        publication.title_en || ""
                    ).toLowerCase();


                const publicationNameUA =
                    String(
                        publication.publication_name_ua || ""
                    ).toLowerCase();


                const publicationNameEN =
                    String(
                        publication.publication_name_en || ""
                    ).toLowerCase();


                if (
                    titleUA &&
                    !publicationTitleUA.includes(
                        titleUA
                    )
                ) {
                    return false;
                }


                if (
                    titleEN &&
                    !publicationTitleEN.includes(
                        titleEN
                    )
                ) {
                    return false;
                }


                if (
                    publicationType &&
                    publication.publication_type !==
                        publicationType
                ) {
                    return false;
                }


                if (
                    publicationName &&
                    !publicationNameUA.includes(
                        publicationName
                    ) &&
                    !publicationNameEN.includes(
                        publicationName
                    )
                ) {
                    return false;
                }


                if (
                    dateFrom &&
                    publication.publication_date <
                        dateFrom
                ) {
                    return false;
                }


                if (
                    dateTo &&
                    publication.publication_date >
                        dateTo
                ) {
                    return false;
                }


                if (
                    status &&
                    publication.status !==
                        status
                ) {
                    return false;
                }


                return true;

            }
        );


    publicationCount.textContent =
        "Знайдено: " +
        filteredPublications.length;


    if (
        filteredPublications.length === 0
    ) {

        publicationList.innerHTML =
            "<p>За заданими фільтрами публікацій не знайдено.</p>";

    publicationList.innerHTML =
        "";


    filteredPublications.forEach(

                document.createElement(

            mainInfo.innerHTML = `

            /*

            const actions =
                document.createElement(

            editButton.textContent =

            editButton.addEventListener(
                "click",
                function() {

                    startPublicationEditing(
                        publication,
                        publicationItem
                    );

                }
            );


            /*
             * ВИДАЛИТИ
             */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.type =
                "button";


            deleteButton.className =
                "admin-button admin-button-danger";


            deleteButton.textContent =
                "ВИДАЛИТИ";


            deleteButton.addEventListener(
                "click",
                async function() {

                    const confirmed =
                        confirm(
                            "Ви впевнені, що хочете видалити цю публікацію?"
                        );


                    if (!confirmed) {
                        return;
                    }


                    deleteButton.disabled =
                        true;


                    deleteButton.textContent =
                        "ВИДАЛЯЄМО...";


                    try {

                        const {
                            error
                        } =
                            await client
                                .from(
                                    "publications"
                                )
                                .delete()
                                .eq(
                                    "id",
                                    publication.id
                                );


                        if (error) {

                            console.error(
                                "Помилка видалення публікації:",
                                error
                            );


                            alert(
                                "Не вдалося видалити публікацію."
                            );


                            return;

                        }


                        alert(
                            "Публікацію успішно видалено."
                        );


                        await loadPublications();

                    } catch (error) {

                        console.error(
                            "Непередбачена помилка:",
                            error
                        );


                        alert(
                            "Сталася помилка під час видалення публікації."
                        );

                    } finally {

                        deleteButton.disabled =
                            false;


                        deleteButton.textContent =
                            "ВИДАЛИТИ";

                    }

                }
            );


            actions.appendChild(
                editButton
            );


            actions.appendChild(
                deleteButton
            );


            details.appendChild(
                actions
            );



            /*
             * РОЗКРИТТЯ
             */

            title.addEventListener(
                "click",
                function() {

                    const isOpen =
                        details.style.display ===
                        "block";


                    details.style.display =
                        isOpen
                            ? "none"
                            : "block";

                }
            );


            publicationItem.appendChild(
                title
            );


            publicationItem.appendChild(
                details
            );


            publicationList.appendChild(
                publicationItem
            );

        }
    );

}

                );


            const contentUA =
                editQuillUA.root.innerHTML;

            if (
                !titleUA ||
                !titleEN ||
                !publicationType ||
                !publicationNameUA ||
                !publicationNameEN ||
                !publicationDate ||
                !excerptUA ||
                !excerptEN ||
                !contentUA ||
                !contentEN
            ) {

                alert(
                    "Заповніть усі обов'язкові поля."
                );

                return;

            }


            saveEditButton.disabled =
                true;


            saveEditButton.textContent =

            try {

                let mainImageUrl =
                    publication.main_image ||
                    null;


                if (
                    mainImageInput &&
                    mainImageInput.files &&
                    mainImageInput.files.length > 0
                ) {

                    const file =
                        mainImageInput.files[0];


                    const fileExtension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const fileName =
                        `${Date.now()}-${Math.random()
                            .toString(36)
                            .substring(2)}.${fileExtension}`;


                    const filePath =
                        `publications/${fileName}`;

                        error:

                    } =
                        await client.storage
                            .from(
                                "publication-images"
                            )
                            .upload(
                                filePath,
                                file
                            );

                        imageUploadError
                    ) {

                        console.error(
                            "Помилка завантаження головного зображення:",
                            imageUploadError
                        );


                        alert(
                            "Не вдалося завантажити головне зображення."
                        );


                        return;

                    }


                    const {
                        data:
                            imageData
                    } =
                        client.storage
                            .from(
                                "publication-images"
                            )
                            .getPublicUrl(
                                filePath
                            );


                    mainImageUrl =
                        imageData.publicUrl;

                }


                const {
                    error
                } =
                    await client
                        .from(
                            "publications"
                        )
                        .update({

                            title_ua:
                                titleUA,

                            title_en:
                                titleEN,

                            publication_type:
                                publicationType,

                            publication_name_ua:
                                publicationNameUA,

                            publication_name_en:
                                publicationNameEN,

                            publication_date:
                                publicationDate,

                            status:
                                status,

                            excerpt_ua:
                                excerptUA,

                            excerpt_en:
                                excerptEN,

                            content_ua:
                                contentUA,

                            content_en:
                                contentEN,

                            main_image:
                                mainImageUrl,

                            caption_ua:
                                captionUA || null,

                            caption_en:
                                captionEN || null,

                            publication_url:
                                publicationUrl || null,

                            slug:
                                slug || null

                        })
                        .eq(
                            "id",
                            publication.id
                        );


                if (error) {

                    console.error(
                        "Помилка оновлення публікації:",
                        error
                    );


                    alert(
                        "Не вдалося зберегти зміни."
                    );


                    return;

                }


                alert(
                    "Зміни успішно збережено."
                );


                editForm.remove();


                editingPublicationId =
                    null;


                await loadPublications();

            } catch (error) {

                console.error(
                    "Непередбачена помилка:",
                    error
                );


                alert(
                    "Сталася помилка під час збереження змін."
                );

            } finally {

                saveEditButton.disabled =
                    false;


                saveEditButton.textContent =
                    "ЗБЕРЕГТИ ЗМІНИ";

            }

        }
    );



    /*
     * СКАСУВАННЯ
     */

    cancelButton.addEventListener(
        "click",
        function() {

            editForm.remove();


            editingPublicationId =
                null;

        }
    );


    /*
     * ПРОКРУТКА
     */

    window.scrollTo({

        top:
            editForm.offsetTop - 30,

        behavior:
            "smooth"

    });

}

/*
 * =========================
 * ДОПОМІЖНІ ФУНКЦІЇ
 * =========================
 */

function escapePublicationHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



function escapePublicationAttribute(
    value
) {

    return escapePublicationHtml(
        value
    );

}



function formatPublicationDateTime(
    value
) {

    if (!value) {
        return "—";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleString(
        "uk-UA"
    );

}
