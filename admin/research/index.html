/*
 * =========================
 * ЗАВАНТАЖЕННЯ ЗОБРАЖЕННЯ
 * У QUILL
 * =========================
 */

async function uploadResearchImage(
    quillEditor
) {

    const input =
        document.createElement(
            "input"
        );


    input.type = "file";

    input.accept =
        "image/jpeg,image/png,image/webp,image/svg+xml";


    input.click();


    input.addEventListener(
        "change",
        async function() {

            const file =
                input.files[0];


            if (!file) {
                return;
            }


            const fileExtension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const fileName =
                `${Date.now()}-${Math.random()
                    .toString(36)
                    .substring(2)}.${fileExtension}`;


            const filePath =
                `research/${fileName}`;


            const {
                error: uploadError
            } =
                await client.storage
                    .from("research-images")
                    .upload(
                        filePath,
                        file
                    );


            if (uploadError) {

                console.error(
                    "Помилка завантаження зображення:",
                    uploadError
                );

                alert(
                    "Не вдалося завантажити зображення."
                );

                return;
            }


            const {
                data
            } =
                client.storage
                    .from("research-images")
                    .getPublicUrl(
                        filePath
                    );


            const imageUrl =
                data.publicUrl;


            const range =
                quillEditor.getSelection(
                    true
                );


            quillEditor.insertEmbed(
                range.index,
                "image",
                imageUrl
            );


            quillEditor.setSelection(
                range.index + 1
            );

        }
    );

}

/*

const saveResearchButton =
    document.getElementById(
        "saveResearchButton"
    );


if (saveResearchButton) {

    saveResearchButton.addEventListener(
        "click",
        async function() {


            const titleUA =
                document.getElementById(
                    "titleUA"
                ).value.trim();


            const titleEN =
                document.getElementById(
                    "titleEN"
                ).value.trim();


            const category =
                document.getElementById(
                    "category"
                ).value;


            const researchDate =
                document.getElementById(
                    "researchDate"
                ).value;


            const status =
                document.getElementById(
                    "researchStatus"
                ).value;


            const excerptUA =
                document.getElementById(
                    "excerptUA"
                ).value.trim();


            const excerptEN =
                document.getElementById(
                    "excerptEN"
                ).value.trim();


            const captionUA =
                document.getElementById(
                    "captionUA"
                ).value.trim();


            const captionEN =
                document.getElementById(
                    "captionEN"
                ).value.trim();


            const slug =
                document.getElementById(
                    "slug"
                ).value.trim();


            const mainImageInput =
                document.getElementById(
                    "mainImage"
                );


            const contentUA =
                researchQuillUA
                    ? researchQuillUA.root.innerHTML
                    : "";


            const contentEN =
                researchQuillEN
                    ? researchQuillEN.root.innerHTML
                    : "";



            /*
             * ПЕРЕВІРКА
             */

            if (
                !titleUA ||
                !titleEN ||
                !category ||
                !researchDate ||
                !excerptUA ||
                !excerptEN ||
                !contentUA ||
                !contentEN
            ) {

                alert(
                    "Заповніть усі обов'язкові поля."
                );

                return;

            }



            saveResearchButton.disabled =
                true;


            saveResearchButton.textContent =
                "ЗБЕРІГАЄМО...";



            try {


                /*
                 * =========================
                 * ГОЛОВНЕ ЗОБРАЖЕННЯ
                 * =========================
                 */

                let mainImageUrl = null;


                if (
                    mainImageInput &&
                    mainImageInput.files &&
                    mainImageInput.files.length > 0
                ) {


                    const file =
                        mainImageInput.files[0];


                    const fileExtension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const fileName =
                        `${Date.now()}-${Math.random()
                            .toString(36)
                            .substring(2)}.${fileExtension}`;


                    const filePath =
                        `research/${fileName}`;


                    const {
                        error:
                            imageUploadError
                    } =
                        await client.storage
                            .from(
                                "research-images"
                            )
                            .upload(
                                filePath,
                                file
                            );


                    if (
                        imageUploadError
                    ) {

                        console.error(
                            "Помилка завантаження головного зображення:",
                            imageUploadError
                        );

                        alert(
                            "Не вдалося завантажити головне зображення."
                        );

                        return;

                    }


                    const {
                        data:
                            imageData
                    } =
                        client.storage
                            .from(
                                "research-images"
                            )
                            .getPublicUrl(
                                filePath
                            );


                    mainImageUrl =
                        imageData.publicUrl;

                }



                /*
                 * =========================
                 * ЗБЕРЕЖЕННЯ В БД
                 * =========================
                 */

                const {
                    data,
                    error
                } =
                    await client
                        .from("research")
                        .insert({

                            title_ua:
                                titleUA,

                            title_en:
                                titleEN,

                            category:
                                category,

                            research_date:
                                researchDate,

                            status:
                                status,

                            excerpt_ua:
                                excerptUA,

                            excerpt_en:
                                excerptEN,

                            content_ua:
                                contentUA,

                            content_en:
                                contentEN,

                            main_image:
                                mainImageUrl,

                            caption_ua:
                                captionUA ||
                                null,

                            caption_en:
                                captionEN ||
                                null,

                            slug:
                                slug ||
                                null

                        })
                        .select()
                        .single();



                if (error) {

                    console.error(
                        "Помилка збереження дослідження:",
                        error
                    );

                    alert(
                        "Не вдалося зберегти дослідження."

                    return;

                console.log(

                    "excerptEN"
                ).value = "";


                document.getElementById(
                    "captionUA"

                document.getElementById(
                    "captionEN"
                ).value = "";


                document.getElementById(
                    "slug"

 */

let allResearch =
    [];


let editingResearchId =
    null;



const researchList =
    document.getElementById(
        "researchList"
    );


const researchCount =
    document.getElementById(
        "researchCount"
    );



async function loadResearch() {

    if (!researchList) {
        return;
    }


    researchList.innerHTML =
        "<p>Завантаження досліджень...</p>";


    const {
        data,
        error
    } =
        await client
            .from("research")
            .select("*")
            .order(
                "research_date",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Помилка завантаження досліджень:",
            error
        );


        researchList.innerHTML =
            "<p>Не вдалося завантажити дослідження.</p>";


        return;

    }


    allResearch =
        data || [];


    renderResearch();

}



/*
 * =========================
 * ВІДОБРАЖЕННЯ ДОСЛІДЖЕНЬ
 * =========================
 */

function renderResearch() {

    if (!researchList) {
        return;
    }


    const titleUA =
        document.getElementById(
            "filterTitleUA"
        ).value
            .trim()
            .toLowerCase();


    const titleEN =
        document.getElementById(
            "filterTitleEN"
        ).value
            .trim()
            .toLowerCase();


    const category =
        document.getElementById(
            "filterCategory"
        ).value;


    const dateFrom =
        document.getElementById(
            "filterDateFrom"
        ).value;


    const dateTo =
        document.getElementById(
            "filterDateTo"
        ).value;


    const status =
        document.getElementById(
            "filterStatus"
        ).value;



    const filteredResearch =
        allResearch.filter(
            function(research) {


                const researchTitleUA =
                    String(
                        research.title_ua ||
                        ""
                    ).toLowerCase();


                const researchTitleEN =
                    String(
                        research.title_en ||
                        ""
                    ).toLowerCase();



                if (
                    titleUA &&
                    !researchTitleUA.includes(
                        titleUA
                    )
                ) {

                    return false;

                }



                if (
                    titleEN &&
                    !researchTitleEN.includes(
                        titleEN
                    )
                ) {

                    return false;

                }



                if (
                    category &&
                    research.category !==
                        category
                ) {

                    return false;

                }



                if (
                    dateFrom &&
                    research.research_date <
                        dateFrom
                ) {

                    return false;

                }



                if (
                    dateTo &&
                    research.research_date >
                        dateTo
                ) {

                    return false;

                }



                if (
                    status &&
                    research.status !==
                        status
                ) {

                    return false;

                }



                return true;

            }
        );



    researchCount.textContent =
        "Знайдено: " +
        filteredResearch.length;



    if (
        filteredResearch.length === 0
    ) {

        researchList.innerHTML =
            "<p>За заданими фільтрами досліджень не знайдено.</p>";

        return;

    }



    researchList.innerHTML =
        "";



    filteredResearch.forEach(
        function(research) {


            const researchItem =
                document.createElement(
                    "article"
                );


            researchItem.className =
                "admin-item";



            /*
             * НАЗВА
             */

            const title =
                document.createElement(
                    "h4"
                );


            title.textContent =
                research.title_ua ||
                "Без назви";


            title.style.cursor =
                "pointer";



            /*
             * ДЕТАЛІ
             */

            const details =
                document.createElement(
                    "div"
                );


            details.style.display =
                "none";



            /*
             * ОСНОВНА ІНФОРМАЦІЯ
             */

            const mainInfo =
                document.createElement(
                    "div"
                );


            mainInfo.className =
                "admin-item-section";


            mainInfo.innerHTML = `

                <h5>
                    Основна інформація
                </h5>

                <p>
                    <strong>Назва UA:</strong>
                    ${escapeResearchHtml(
                        research.title_ua
                    )}
                </p>

                <p>
                    <strong>Назва EN:</strong>
                    ${escapeResearchHtml(
                        research.title_en
                    )}
                </p>

                <p>
                    <strong>Категорія:</strong>
                    ${escapeResearchHtml(
                        research.category
                    )}
                </p>

                <p>
                    <strong>Дата дослідження:</strong>
                    ${escapeResearchHtml(
                        research.research_date
                    )}
                </p>

                <p>
                    <strong>Статус:</strong>
                    ${
                        research.status ===
                        "published"
                            ? "Опубліковано"
                            : "Чернетка"
                    }
                </p>

            `;


            details.appendChild(
                mainInfo
            );



            /*
             * КОРОТКИЙ ОПИС
             */

            const excerpts =
                document.createElement(
                    "div"
                );


            excerpts.className =
                "admin-item-section";


            excerpts.innerHTML = `

                <h5>
                    Короткий опис
                </h5>

                <p>
                    <strong>
                        Опис UA:
                    </strong>
                </p>

                <div class="admin-article-text">
                    ${escapeResearchHtml(
                        research.excerpt_ua
                    )}
                </div>

                <p>
                    <strong>
                        Опис EN:
                    </strong>
                </p>

                <div class="admin-article-text">
                    ${escapeResearchHtml(
                        research.excerpt_en
                    )}
                </div>

            `;


            details.appendChild(
                excerpts
            );



            /*
             * ОСНОВНИЙ ТЕКСТ
             */

            const contents =
                document.createElement(
                    "div"
                );


            contents.className =
                "admin-item-section";


            contents.innerHTML = `

                <h5>
                    Основний текст UA
                </h5>

                <div class="admin-article-content">
                    ${
                        research.content_ua ||
                        ""
                    }
                </div>


                <h5>
                    Основний текст EN
                </h5>

                <div class="admin-content">
                    ${
                        research.content_en ||
                        ""
                    }
                </div>

            `;


            details.appendChild(
                contents
            );



            /*
             * ЗОБРАЖЕННЯ
             */

            const imageSection =
                document.createElement(
                    "div"
                );


            imageSection.className =
                "admin-item-section";


            let imageHtml =
                "<p><strong>Головне зображення:</strong> не завантажено</p>";


            if (
                research.main_image
            ) {

                imageHtml = `

                    <p>
                        <strong>
                            Головне зображення:
                        </strong>
                    </p>

                    <img
                        src="${escapeResearchAttribute(
                            research.main_image
                        )}"
                        alt="${escapeResearchAttribute(
                            research.caption_ua ||
                            research.title_ua ||
                            ""
                        )}"
                        class="admin-image"
                    >

                `;

            }


            imageSection.innerHTML = `

                <h5>
                    Зображення
                </h5>

                ${imageHtml}

                <p>
                    <strong>
                        Підпис UA:
                    </strong>
                    ${
                        escapeResearchHtml(
                            research.caption_ua ||
                            "—"
                        )
                    }
                </p>

                <p>
                    <strong>
                        Підпис EN:
                    </strong>
                    ${
                        escapeResearchHtml(
                            research.caption_en ||
                            "—"
                        )
                    }
                </p>

            `;


            details.appendChild(
                imageSection
            );



            /*
             * SLUG
             */

            const additionalData =
                document.createElement(
                    "div"
                );


            additionalData.className =
                "admin-item-section";


            additionalData.innerHTML = `

                <h5>
                    Додаткові дані
                </h5>

                <p>
                    <strong>
                        Slug:
                    </strong>
                    ${
                        escapeResearchHtml(
                            research.slug ||
                            "—"
                        )
                    }
                </p>

            `;


            details.appendChild(
                additionalData
            );



            /*
             * СИСТЕМНА ІНФОРМАЦІЯ
             */

            const systemData =
                document.createElement(
                    "div"
                );


            systemData.className =
                "admin-system-info";


            systemData.innerHTML = `

                <p>
                    <strong>
                        ID:
                    </strong>
                    ${escapeResearchHtml(
                        research.id
                    )}
                </p>

                <p>
                    <strong>
                        Створено:
                    </strong>
                    ${formatResearchDateTime(
                        research.created_at
                    )}
                </p>

                <p>
                    <strong>
                        Оновлено:
                    </strong>
                    ${formatResearchDateTime(
                        research.updated_at
                    )}
                </p>

            `;


            details.appendChild(
                systemData
            );



            /*
             * КНОПКИ
             */

            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "admin-item-actions";



            /*
             * РЕДАГУВАТИ
             */

            const editButton =
                document.createElement(
                    "button"
                );


            editButton.type =
                "button";


            editButton.className =
                "admin-button";


            editButton.textContent =
                "РЕДАГУВАТИ";



            /*
             * ВИДАЛИТИ
             */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.type =
                "button";


            deleteButton.className =
                "admin-button admin-button-danger";


            deleteButton.textContent =
                "ВИДАЛИТИ";



            deleteButton.addEventListener(
                "click",
                async function() {


                    const confirmed =
                        confirm(
                            "Ви впевнені, що хочете видалити це дослідження?"
                        );


                    if (!confirmed) {
                        return;
                    }


                    deleteButton.disabled =
                        true;


                    deleteButton.textContent =
                        "ВИДАЛЯЄМО...";


                    try {


                        const {
                            error
                        } =
                            await client
                                .from("research")
                                .delete()
                                .eq(
                                    "id",
                                    research.id
                                );


                        if (error) {

                            console.error(
                                "Помилка видалення дослідження:",
                                error
                            );


                            alert(
                                "Не вдалося видалити дослідження."
                            );


                            return;

                        }


                        alert(
                            "Дослідження успішно видалено."
                        );


                        await loadResearch();


                    } catch (error) {

                        console.error(
                            "Непередбачена помилка:",
                            error
                        );


                        alert(
                            "Сталася помилка під час видалення дослідження."
                        );


                    } finally {

                        deleteButton.disabled =
                            false;


                        deleteButton.textContent =
                            "ВИДАЛИТИ";

                    }

                }
            );



            /*
             * РЕДАГУВАННЯ
             */

            editButton.addEventListener(
                "click",
                function() {

                    startResearchEditing(
                        research,
                        researchItem
                    );

                }
            );


            actions.appendChild(
                editButton
            );


            actions.appendChild(
                deleteButton
            );


            details.appendChild(
                actions
            );



            /*
             * РОЗКРИТТЯ
             */

            title.addEventListener(
                "click",
                function() {


                    const isOpen =
                        details.style.display ===
                        "block";


                    details.style.display =
                        isOpen
                            ? "none"
                            : "block";

                }
            );



            researchItem.appendChild(
                title
            );


            researchItem.appendChild(
                details
            );


            researchList.appendChild(
                researchItem
            );

        }
    );

}

    researchItem.appendChild(

    /*

     * QUILL РЕДАГУВАННЯ EN
     */

    const editContentEN =
        editForm.querySelector(
            ".edit-content-en"

    const editQuillEN =
        new Quill(
            editContentEN,
            {
                theme: "snow",

                modules: {

        research.content_en ||
        "";

        editQuillEN.getModule(
            "toolbar"
        );


    editToolbarEN.addHandler(
        "image",
        function() {

            uploadResearchImage(
                editQuillEN
            );

        }

     * КНОПКИ
     */

    const cancelButton =
        editForm.querySelector(
            ".edit-cancel-button"
        );


    const saveEditButton =
        editForm.querySelector(
            ".edit-save-button"
        );



    /*
     * =========================
     * ЗБЕРЕЖЕННЯ РЕДАГУВАННЯ
     * =========================
     */

    saveEditButton.addEventListener(
        "click",
        async function() {


            const titleUA =
                editForm.querySelector(
                    ".edit-title-ua"
                ).value.trim();


            const titleEN =
                editForm.querySelector(
                    ".edit-title-en"
                ).value.trim();


            const category =
                editForm.querySelector(
                    ".edit-category"
                ).value;


            const researchDate =
                editForm.querySelector(
                    ".edit-research-date"
                ).value;


            const status =
                editForm.querySelector(
                    ".edit-status"
                ).value;


            const excerptUA =
                editForm.querySelector(
                    ".edit-excerpt-ua"
                ).value.trim();


            const excerptEN =
                editForm.querySelector(
                    ".edit-excerpt-en"
                ).value.trim();


            const captionUA =
                editForm.querySelector(
                    ".edit-caption-ua"
                ).value.trim();


            const captionEN =
                editForm.querySelector(
                    ".edit-caption-en"
                ).value.trim();


            const slug =
                editForm.querySelector(
                    ".edit-slug"
                ).value.trim();


            const mainImageInput =
                editForm.querySelector(
                    ".edit-main-image"
                );


            const contentUA =
                editQuillUA.root.innerHTML;


            const contentEN =
                editQuillEN.root.innerHTML;



            /*
             * ПЕРЕВІРКА
             */

            if (
                !titleUA ||
                !titleEN ||
                !category ||
                !researchDate ||
                !excerptUA ||
                !excerptEN ||
                !contentUA ||
                !contentEN
            ) {

                alert(
                    "Заповніть усі обов'язкові поля."
                );

                return;

            }



            saveEditButton.disabled =
                true;


            saveEditButton.textContent =
                "ЗБЕРІГАЄМО...";



            try {


                /*
                 * =========================
                 * ГОЛОВНЕ ЗОБРАЖЕННЯ
                 * =========================
                 */

                let mainImageUrl =
                    research.main_image ||
                    null;


                if (
                    mainImageInput &&
                    mainImageInput.files &&
                    mainImageInput.files.length > 0
                ) {


                    const file =
                        mainImageInput.files[0];


                    const fileExtension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const fileName =
                        `${Date.now()}-${Math.random()
                            .toString(36)
                            .substring(2)}.${fileExtension}`;


                    const filePath =
                        `research/${fileName}`;


                    const {
                        error:
                            imageUploadError
                    } =
                        await client.storage
                            .from(
                                "research-images"
                            )
                            .upload(
                                filePath,
                                file
                            );


                    if (
                        imageUploadError
                    ) {

                        console.error(
                            "Помилка завантаження головного зображення:",
                            imageUploadError
                        );


                        alert(
                            "Не вдалося завантажити головне зображення."
                        );


                        return;

                    }


                    const {
                        data:
                            imageData
                    } =
                        client.storage
                            .from(
                                "research-images"
                            )
                            .getPublicUrl(
                                filePath
                            );


                    mainImageUrl =
                        imageData.publicUrl;

                }



                /*
                 * =========================
                 * ОНОВЛЕННЯ
                 * =========================
                 */

                const {
                    error
                } =
                    await client
                        .from("research")
                        .update({

                            title_ua:
                                titleUA,

                            title_en:
                                titleEN,

                            category:
                                category,

                            research_date:
                                researchDate,

                            status:
                                status,

                            excerpt_ua:
                                excerptUA,

                            excerpt_en:
                                excerptEN,

                            content_ua:
                                contentUA,

                            content_en:
                                contentEN,

                            main_image:
                                mainImageUrl,

                            caption_ua:
                                captionUA ||
                                null,

                            caption_en:
                                captionEN ||
                                null,

                            slug:
                                slug ||
                                null

                        })
                        .eq(
                            "id",
                            research.id
                        );



                if (error) {

                    console.error(
                        "Помилка оновлення дослідження:",
                        error
                    );


                    alert(
                        "Не вдалося зберегти зміни."
                    );


                    return;

                }



                alert(
                    "Зміни успішно збережено."
                );


                editForm.remove();


                editingResearchId =
                    null;


                await loadResearch();


            } catch (error) {

                console.error(
                    "Непередбачена помилка:",
                    error
                );


                alert(
                    "Сталася помилка під час збереження змін."
                );


            } finally {

                saveEditButton.disabled =
                    false;


                saveEditButton.textContent =
                    "ЗБЕРЕГТИ ЗМІНИ";

            }

        }
    );



    /*
     * СКАСУВАННЯ
     */

    cancelButton.addEventListener(
        "click",
        function() {

            editForm.remove();


            editingResearchId =
                null;

        }
    );



    /*
     * ПРОКРУТКА
     */

    window.scrollTo({
        top:
            editForm.offsetTop - 30,

        behavior:
            "smooth"
    });

}

/*
 * =========================
 * ДОПОМІЖНІ ФУНКЦІЇ
 * =========================
 */

function escapeResearchHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



function escapeResearchAttribute(
    value
) {

    return escapeResearchHtml(
        value
    );

}



function formatResearchDateTime(
    value
) {

    if (!value) {
        return "—";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleString(
        "uk-UA"
    );

}
