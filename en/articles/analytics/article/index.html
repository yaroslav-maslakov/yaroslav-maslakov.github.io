
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytical Article — Yaroslav Maslakov</title>
    <link rel="stylesheet" href="../../../../style.css">
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">YAROSLAV MASLAKOV</div>

        <nav>
            <a href="../../../index.html">Home</a>
            <a href="../../index.html" class="active">Articles</a>
            <a href="../../../research/index.html">Research</a>
            <a href="../../../publications/index.html">Publications</a>
            <a href="../../../certificates/index.html">Certificates</a>
            <a href="../../../about/index.html">About me</a>
            <a href="../../../contacts/index.html">Contact</a>
        </nav>

        <button
            class="menu-toggle"
            type="button"
            aria-label="Open menu"
            onclick="this.textContent = this.textContent === 'MENU' ? 'CLOSE' : 'MENU'; document.querySelector('nav').classList.toggle('menu-open')"
        >
            MENU
        </button>

        <div class="language">
            <a href="../../../../uk/articles/analytics/article/index.html">UA</a>
            <span>|</span>
            <a href="../../../../en/articles/analytics/article/index.html">EN</a>
        </div>

    </div>
</header>


<main class="page">

    <div class="page-content">

        <article id="article-content">
            <p>Loading article...</p>
        </article>

        <div class="article-navigation">

            <a
                class="article-navigation-link"
                href="../index.html"
            >
                <span class="article-navigation-arrow">←</span>
                <span>
                    <strong>Analytical Articles</strong>
                </span>
            </a>

            <a
                class="article-navigation-link article-home-link"
                href="../../../index.html"
            >
                <span class="article-navigation-arrow">⌂</span>
                <span>
                    <strong>Back to the Homepage</strong>
                </span>
            </a>

        </div>

    </div>

</main>


<footer>
    © 2026 Yaroslav Maslakov
</footer>


<script>
    const menuButton = document.querySelector('.menu-toggle');
    const menu = document.querySelector('nav');

    document.addEventListener('click', function(event) {
        if (!menuButton || !menu) return;

        if (!menu.contains(event.target) && !menuButton.contains(event.target)) {
            menu.classList.remove('menu-open');
            menuButton.textContent = 'MENU';
        }
    });
</script>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>
    const SUPABASE_URL =
        "https://jtplvfweyguheyqyewal.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_jAg0m8G8Pj30tCF7qND3ydQ_-WDv4EhP";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    async function loadArticle() {

        const articleContent =
            document.getElementById("article-content");

        const params =
            new URLSearchParams(
                window.location.search
            );

        const slug =
            params.get("slug");

        if (!slug) {
            articleContent.innerHTML = `
                <p>Article not found.</p>
            `;
            return;
        }

        const { data, error } =
            await supabaseClient
                .from("articles")
                .select("*")
                .eq("slug", slug)
                .eq("status", "published")
                .eq("category", "Аналітика")
                .single();

        if (error || !data) {

            console.error(
                "Error loading article:",
                error
            );

            articleContent.innerHTML = `
                <p>Unable to load the article.</p>
            `;

            return;
        }

        document.title =
            `${data.title_en || "Analytical Article"} — Yaroslav Maslakov`;

        let contentHtml = "";

        if (data.content_en) {
            contentHtml =
                data.content_en
                    .split(/\n\s*\n/)
                    .map(paragraph => {
                        return `
                            <p>
                                ${paragraph.replace(/\n/g, "<br>")}
                            </p>
                        `;
                    })
                    .join("");
        }

        articleContent.innerHTML = `

            <div class="page-header">

                <h1>
                    ${escapeHtml(data.title_en || "")}
                </h1>

                <p>
                    ${formatDate(data.publication_date)}
                </p>

            </div>

            ${
                data.main_image
                    ? `
                        <div class="article-image">

                            <img
                                src="${escapeHtml(data.main_image)}"
                                alt="${escapeHtml(data.caption_en || data.title_en || "")}"
                            >

                            ${
                                data.caption_en
                                    ? `
                                        <p class="article-caption">
                                            ${escapeHtml(data.caption_en)}
                                        </p>
                                    `
                                    : ""
                            }

                        </div>
                    `
                    : ""
            }

            <div class="article-text">
                ${contentHtml}
            </div>

        `;
    }


    function formatDate(date) {

        if (!date) return "";

        const parts =
            date.split("-");

        if (parts.length !== 3) {
            return escapeHtml(date);
        }

        return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text ?? "";

        return div.innerHTML;
    }


    loadArticle();

</script>

</body>
</html>
