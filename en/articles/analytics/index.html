<body>

<header>
    <div class="header-inner">

        <div class="logo">YAROSLAV MASLAKOV</div>

        <nav>
            <a href="../../index.html">Home</a>
            <a href="../index.html" class="active">Articles</a>

        </nav>

        <button class="menu-toggle" type="button" aria-label="Open menu" onclick="this.textContent = this.textContent === 'MENU' ? 'CLOSE' : 'MENU'; document.querySelector('nav').classList.toggle('menu-open')">MENU</button>

        <div class="language">
            <a href="../../../uk/articles/analytics/index.html">UA</a>

</header>

<main class="page">

    <div class="page-header">
        <h1>Analytical Materials</h1>

            Materials focused on the analysis of events, trends,
            and social processes.
        </p>
    </div>

   <div class="page-content">

    <div class="page-cards" id="articles-list">

        <p id="loading-message">Loading materials...</p>

    </div>

</div>

</main>

<footer>
    © 2026 Yaroslav Maslakov
</footer>
<script>
    const menuButton = document.querySelector('.menu-toggle');
    const menu = document.querySelector('nav');

    document.addEventListener('click', function(event) {
        if (!menuButton || !menu) return;

        if (!menu.contains(event.target) && !menuButton.contains(event.target)) {
            menu.classList.remove('menu-open');
            menuButton.textContent = 'MENU';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://jtplvfweyguheyqyewal.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jAg0mG8Pj30tCF7qND3ydQ_-WDv4EhP";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function loadArticles() {

        const articlesList = document.getElementById("articles-list");

        const { data, error } = await supabaseClient
            .from("articles")
            .select("*")
            .eq("status", "published")
            .eq("category", "Аналітика")
            .order("publication_date", { ascending: false });

        if (error) {
            console.error("Error loading articles:", error);

            articlesList.innerHTML = `
                <p>Unable to load materials.</p>
            `;

            return;
        }

        if (!data || data.length === 0) {
            articlesList.innerHTML = `
                <p>No published analytical materials yet.</p>
            `;

            return;
        }

        articlesList.innerHTML = "";

        data.forEach(article => {

            const card = document.createElement("article");
            card.className = "page-card";

            card.innerHTML = `
                <div class="page-card-type">Analysis</div>

                <h2>${escapeHtml(article.title_en || "")}</h2>

                <p>
                    ${escapeHtml(article.excerpt_en || "")}
                </p>
            `;

            articlesList.appendChild(card);
        });
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    loadArticles();
</script>
    
</body>
</html>
