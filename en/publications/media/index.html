<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journalistic Publications — Yaroslav Maslakov</title>
    <link rel="stylesheet" href="../../../style.css">
</head>
<body>

<header>
    <div class="header-inner">

        <div class="logo">YAROSLAV MASLAKOV</div>

        <nav>
            <a href="../../index.html">Home</a>
            <a href="../../articles/index.html">Articles</a>
            <a href="../../research/index.html">Research</a>
            <a href="../index.html" class="active">Publications</a>
            <a href="../../certificates/index.html">Certificates</a>
            <a href="../../about/index.html">About</a>
            <a href="../../contacts/index.html">Contacts</a>
        </nav>

        <button class="menu-toggle" type="button" aria-label="Open menu" onclick="this.textContent = this.textContent === 'MENU' ? 'CLOSE' : 'MENU'; document.querySelector('nav').classList.toggle('menu-open')">MENU</button>

        <div class="language">
            <a href="../../../uk/publications/media/index.html">UA</a>
            <span>|</span>
            <a href="../../../en/publications/media/index.html">EN</a>
        </div>

    </div>
</header>

<main class="page">

    <div class="page-header">
        <h1>Journalistic Publications</h1>
        <p>
            Published journalistic materials prepared
            for media outlets and other information resources.
        </p>
    </div>

    <div class="page-content">

    <div class="page-cards" id="publications-list">

        <p id="loading-message">Loading publications...</p>

    </div>

</div>

</main>

<footer>
    © 2026 Yaroslav Maslakov
</footer>
<script>
    const menuButton = document.querySelector('.menu-toggle');
    const menu = document.querySelector('nav');

    document.addEventListener('click', function(event) {
        if (!menuButton || !menu) return;

        if (!menu.contains(event.target) && !menuButton.contains(event.target)) {
            menu.classList.remove('menu-open');
            menuButton.textContent = 'MENU';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://jtplvfweyguheyqyewal.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jAg0mG8Pj30tCF7qND3ydQ_-WDv4EhP";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function loadPublications() {

        const publicationsList = document.getElementById("publications-list");

        const { data, error } = await supabaseClient
            .from("publications")
            .select("*")
            .eq("status", "published")
            .eq("publication_type", "media")
            .order("publication_date", { ascending: false });

        if (error) {
            console.error("Error loading publications:", error);

            publicationsList.innerHTML = `
                <p>Failed to load publications.</p>
            `;

            return;
        }

        if (!data || data.length === 0) {
            publicationsList.innerHTML = `
                <p>There are no published media publications yet.</p>
            `;

            return;
        }

        publicationsList.innerHTML = "";

        data.forEach(publication => {

            const card = document.createElement("article");
            card.className = "page-card";

            card.innerHTML = `
                <h2>${escapeHtml(publication.title_en || "")}</h2>

                <p>
                    ${escapeHtml(publication.description_en || "")}
                </p>
            `;

            publicationsList.appendChild(card);
        });
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    loadPublications();
</script>
    
</body>
</html>
