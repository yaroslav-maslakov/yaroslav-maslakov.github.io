<script>
    const menuButton = document.querySelector('.menu-toggle');
    const menu = document.querySelector('nav');

    document.addEventListener('click', function(event) {
        if (!menuButton || !menu) return;

        if (!menu.contains(event.target) && !menuButton.contains(event.target)) {
            menu.classList.remove('menu-open');
            menuButton.textContent = 'MENU';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://jtplvfweyguheyqyewal.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jAg0m8G8Pj30tCF7qND3ydQ_-WDv4EhP";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text ?? "";
        return div.innerHTML;
    }

    async function loadMaterial() {
        const params = new URLSearchParams(window.location.search);
        const materialId = params.get("id");

        const titleElement = document.getElementById("material-title");
        const dateElement = document.getElementById("material-date");
        const contentElement = document.getElementById("material-content");

        if (!materialId) {
            titleElement.textContent = "Project not found";
            contentElement.innerHTML =
                "<p>No project ID was provided.</p>";
            return;
        }

        const { data, error } = await supabaseClient
            .from("articles")
            .select("*")
            .eq("id", materialId)
            .eq("status", "published")
            .eq("category", "Дослідницькі проєкти")
            .maybeSingle();

        if (error) {
            console.error("Error loading project:", error);
            titleElement.textContent = "Loading error";
            contentElement.innerHTML =
                "<p>Could not load this project.</p>";
            return;
        }

        if (!data) {
            titleElement.textContent = "Project not found";
            contentElement.innerHTML =
                "<p>This project does not exist or is unavailable.</p>";
            return;
        }

        document.title =
            (data.title_en || "Research Projects") +
            " — Yaroslav Maslakov";

        titleElement.textContent = data.title_en || "Untitled";

        if (data.publication_date) {
            const date = new Date(data.publication_date + "T00:00:00");

            dateElement.textContent = isNaN(date.getTime())
                ? data.publication_date
                : date.toLocaleDateString("en-GB", {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });
        } else {
            dateElement.textContent = "";
        }

        const fullText = data.content_en || data.body_en || "";

        contentElement.innerHTML = fullText
            ? `<div>${escapeHtml(fullText).replace(/\n/g, "<br>")}</div>`
            : `<p>${escapeHtml(data.excerpt_en || "The full text is not available yet.")}</p>`;

        document.getElementById("ua-link").href =
            `../../../../uk/research/research-projects/article/index.html?id=${encodeURIComponent(data.id)}`;

        document.getElementById("en-link").href =
            `../../../../en/research/research-projects/article/index.html?id=${encodeURIComponent(data.id)}`;
    }

    loadMaterial();
</script>

</body>
</html>
