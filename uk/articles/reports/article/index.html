<script>
    const menuButton = document.querySelector('.menu-toggle');
    const menu = document.querySelector('nav');

    document.addEventListener('click', function(event) {
        if (!menuButton || !menu) return;

        if (!menu.contains(event.target) && !menuButton.contains(event.target)) {
            menu.classList.remove('menu-open');
            menuButton.textContent = 'МЕНЮ';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://jtplvfweyguheyqyewal.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_jAg0m8G8Pj30tCF7qND3ydQ_-WDv4EhP";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function loadArticle() {
        const articleContent = document.getElementById("article-content");
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");

        if (!slug) {
            articleContent.innerHTML = "<p>Матеріал не знайдено.</p>";
            return;
        }

        const { data, error } = await supabaseClient
            .from("articles")
            .select("*")
            .eq("slug", slug)
            .eq("status", "published")
            .eq("category", "Репортаж")
            .single();

        if (error || !data) {
            console.error("Помилка завантаження репортажу:", error);
            articleContent.innerHTML =
                "<p>Не вдалося завантажити матеріал.</p>";
            return;
        }

        document.title =
            `${data.title_ua || "Репортаж"} — Ярослав Маслаков`;

        let contentHtml = "";

        if (data.content_ua) {
            const content = data.content_ua.trim();

            if (/<\/?[a-z][\s\S]*>/i.test(content)) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(content, "text/html");

                doc.querySelectorAll(
                    "script, style, iframe, object, embed, form, link, meta"
                ).forEach(el => el.remove());

                doc.body.querySelectorAll("*").forEach(el => {
                    [...el.attributes].forEach(attr => {
                        const name = attr.name.toLowerCase();
                        const value = attr.value.trim();

                        if (
                            name.startsWith("on") ||
                            (
                                ["href", "src", "xlink:href", "action", "formaction"].includes(name) &&
                                /^\s*(javascript|vbscript):/i.test(value)
                            ) ||
                            (
                                name === "style" &&
                                /expression\s*\(|url\s*\(\s*['"]?\s*javascript:/i.test(value)
                            )
                        ) {
                            el.removeAttribute(attr.name);
                        }
                    });
                });

                contentHtml = doc.body.innerHTML;
            } else {
                contentHtml = content
                    .split(/\n\s*\n/)
                    .map(paragraph =>
                        `<p>${escapeHtml(paragraph).replace(/\n/g, "<br>")}</p>`
                    )
                    .join("");
            }
        }

        articleContent.innerHTML = `
            <div class="page-header">
                <h1>${escapeHtml(data.title_ua || "")}</h1>
                <p>${formatDate(data.publication_date)}</p>
            </div>

            ${
                data.main_image
                    ? `
                        <div class="article-image">
                            <img
                                src="${escapeHtml(data.main_image)}"
                                alt="${escapeHtml(data.caption_ua || data.title_ua || "")}"
                            >
                            ${
                                data.caption_ua
                                    ? `
                                        <p class="article-caption">
                                            ${escapeHtml(data.caption_ua)}
                                        </p>
                                    `
                                    : ""
                            }
                        </div>
                    `
                    : ""
            }

            <div class="article-text">
                ${contentHtml}
            </div>
        `;
    }

    function formatDate(date) {
        if (!date) return "";

        const parts = date.split("-");

        if (parts.length !== 3) {
            return escapeHtml(date);
        }

        return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = String(text);
        return div.innerHTML;
    }

    loadArticle();
</script>

</body>
</html>
