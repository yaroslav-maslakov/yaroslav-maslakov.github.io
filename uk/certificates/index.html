<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Сертифікати — Ярослав Маслаков</title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

</head>


<body>


    <header>

        <div class="header-inner">


            <div class="logo">
                ЯРОСЛАВ МАСЛАКОВ
            </div>


            <nav>

                <a href="../index.html">
                    Головна
                </a>

                <a href="../articles/index.html">
                    Статті
                </a>

                <a href="../research/index.html">
                    Дослідження
                </a>

                <a href="../publications/index.html">
                    Публікації
                </a>

                <a
                    href="index.html"
                    class="active"
                >
                    Сертифікати
                </a>

                <a href="../about/index.html">
                    Про мене
                </a>

                <a href="../contacts/index.html">
                    Контакти
                </a>

            </nav>


            <button
                class="menu-toggle"
                type="button"
                aria-label="Відкрити меню"
                onclick="
                    this.textContent =
                        this.textContent === 'МЕНЮ'
                        ? 'ЗАКРИТИ'
                        : 'МЕНЮ';

                    document
                        .querySelector('nav')
                        .classList
                        .toggle('menu-open');
                "
            >
                МЕНЮ
            </button>


            <div class="language">

                <a href="index.html">
                    UA
                </a>

                <span>|</span>

                <a href="../../en/certificates/index.html">
                    EN
                </a>

            </div>


        </div>

    </header>



    <main>


        <section class="latest">


            <h2>
                Сертифікати
            </h2>


            <div id="certificates">

                Завантаження...

            </div>


        </section>


    </main>



    <footer>

        © 2026 Ярослав Маслаков

    </footer>



<script>


    /*
     * SUPABASE
     */

    const SUPABASE_URL =
        "https://jtplvfweyguheyqyewal.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_jAg0mG8Pj30tCF7qND3ydQ_-WDv4EhP";


    /*
     * КОНТЕЙНЕР
     */

    const certificatesContainer =
        document.getElementById(
            "certificates"
        );



    /*
     * ЗАХИСТ ВІД HTML
     */

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }



    /*
     * ЗАХИСТ ПОСИЛАННЯ
     */

    function escapeAttribute(value) {

        if (!value) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

    }



    /*
     * ЗАВАНТАЖЕННЯ СЕРТИФІКАТІВ
     */

    async function loadCertificates() {

        try {


            const response =
                await fetch(

                    `${SUPABASE_URL}/rest/v1/certificates?select=*&published=eq.true&order=certificate_date.desc`,

                    {

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${SUPABASE_KEY}`

                        }

                    }

                );



            /*
             * ПЕРЕВІРКА ВІДПОВІДІ SUPABASE
             */

            if (!response.ok) {


                const errorText =
                    await response.text();


                throw new Error(

                    `Supabase ${response.status}: ${errorText}`

                );

            }



            /*
             * ОТРИМУЄМО ДАНІ
             */

            const certificates =
                await response.json();



            /*
             * ЯКЩО СЕРТИФІКАТІВ НЕМАЄ
             */

            if (
                !certificates ||
                certificates.length === 0
            ) {

                certificatesContainer.innerHTML =
                    "<p>Сертифікатів поки немає.</p>";

                return;

            }



            /*
             * ВИВОДИМО СЕРТИФІКАТИ
             */

            certificatesContainer.innerHTML =

                certificates
                    .map(
                        function(certificate) {


                            const date =
                                new Date(
                                    certificate.certificate_date
                                ).toLocaleDateString(
                                    "uk-UA"
                                );



                            return `

                                <article
                                    class="certificate-card"
                                >


                                    <h3>

                                        ${escapeHtml(
                                            certificate.title
                                        )}

                                    </h3>



                                    <p
                                        class="certificate-organization"
                                    >

                                        ${escapeHtml(
                                            certificate.organization
                                        )}

                                    </p>



                                    <p
                                        class="certificate-meta"
                                    >

                                        ${date}

                                        ${
                                            certificate.hours
                                            ? ` · ${escapeHtml(
                                                certificate.hours
                                              )} год.`
                                            : ""
                                        }

                                        ${
                                            certificate.ects
                                            ? ` · ${escapeHtml(
                                                certificate.ects
                                              )} кредит ЄКТС`
                                            : ""
                                        }

                                    </p>



                                    ${
                                        certificate.description

                                        ?

                                        `

                                            <p
                                                class="certificate-description"
                                            >

                                                ${escapeHtml(
                                                    certificate.description
                                                )}

                                            </p>

                                        `

                                        :

                                        ""

                                    }



                                    ${
                                        certificate.file_url

                                        ?

                                        `

                                            <a
                                                class="certificate-link"
                                                href="${escapeAttribute(
                                                    certificate.file_url
                                                )}"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                            >

                                                Переглянути сертифікат →

                                            </a>

                                        `

                                        :

                                        ""

                                    }


                                </article>

                            `;

                        }
                    )
                    .join("");


        }


        catch (error) {


            console.error(
                "Помилка завантаження сертифікатів:",
                error
            );


            certificatesContainer.innerHTML = `

                <p>
                    Не вдалося завантажити сертифікати.
                </p>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            `;

        }

    }



    /*
     * ЗАПУСК
     */

    loadCertificates();



    /*
     * ЗАКРИТТЯ МОБІЛЬНОГО МЕНЮ
     */

    const menuButton =
        document.querySelector(
            ".menu-toggle"
        );


    const menu =
        document.querySelector(
            "nav"
        );


    document.addEventListener(
        "click",
        function(event) {

            if (
                !menuButton ||
                !menu
            ) {

                return;

            }


            if (
                !menu.contains(
                    event.target
                )

                &&

                !menuButton.contains(
                    event.target
                )
            ) {

                menu.classList.remove(
                    "menu-open"
                );

                menuButton.textContent =
                    "МЕНЮ";

            }

        }
    );


</script>


</body>

</html>
