<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Сертифікати — Ярослав Маслаков</title>

    <link rel="stylesheet" href="../../style.css">
</head>

<body>

<header>
    <div class="container">
        <a href="../index.html" class="logo">ЯРОСЛАВ МАСЛАКОВ</a>

        <button class="menu-toggle" id="menuToggle">МЕНЮ</button>

        <nav id="mainNav">
            <a href="../index.html">ГОЛОВНА</a>
            <a href="../articles/index.html">СТАТТІ</a>
            <a href="../research/index.html">ДОСЛІДЖЕННЯ</a>
            <a href="../publications/index.html">ПУБЛІКАЦІЇ</a>
            <a href="index.html" class="active">СЕРТИФІКАТИ</a>
            <a href="../about/index.html">ПРО МЕНЕ</a>
            <a href="../contacts/index.html">КОНТАКТИ</a>
        </nav>
    </div>
</header>

<main class="container">

    <h1>СЕРТИФІКАТИ</h1>

    <div id="certificates">
        Завантаження...
    </div>

</main>

<footer>
    <div class="container">
        © Ярослав Маслаков
    </div>
</footer>

<script>
    const SUPABASE_URL = "https://jtplvfweyguheyqyewal.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jAg0mG8Pj30tCF7qND3ydQ_-WDv4EhP";

    const certificatesContainer = document.getElementById("certificates");

    async function loadCertificates() {
        try {
            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/certificates?select=*&published=eq.true&order=certificate_date.desc`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                }
            );

            if (!response.ok) {
                throw new Error("Не вдалося завантажити сертифікати");
            }

            const certificates = await response.json();

            if (certificates.length === 0) {
                certificatesContainer.innerHTML =
                    "<p>Сертифікатів поки немає.</p>";
                return;
            }

            certificatesContainer.innerHTML = certificates.map(certificate => {

                const date = new Date(certificate.certificate_date)
                    .toLocaleDateString("uk-UA");

                return `
                    <article class="certificate-card">

                        <h2>${escapeHtml(certificate.title)}</h2>

                        <p class="certificate-organization">
                            ${escapeHtml(certificate.organization)}
                        </p>

                        <p class="certificate-meta">
                            ${date}
                            ${certificate.hours ? ` · ${certificate.hours} год.` : ""}
                            ${certificate.ects ? ` · ${certificate.ects} кредит ЄКТС` : ""}
                        </p>

                        ${certificate.description ? `
                            <p class="certificate-description">
                                ${escapeHtml(certificate.description)}
                            </p>
                        ` : ""}

                        ${certificate.file_url ? `
                            <a
                                href="${escapeAttribute(certificate.file_url)}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="certificate-link"
                            >
                                ПЕРЕГЛЯНУТИ СЕРТИФІКАТ →
                            </a>
                        ` : ""}

                    </article>
                `;

            }).join("");

        } catch (error) {

            console.error(error);

            certificatesContainer.innerHTML =
                "<p>Не вдалося завантажити сертифікати.</p>";
        }
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    loadCertificates();
</script>

</body>
</html>
