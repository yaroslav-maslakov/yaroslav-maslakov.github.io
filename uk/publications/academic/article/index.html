<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Академічна публікація — Ярослав Маслаков</title>
    <link rel="stylesheet" href="../../../../style.css">
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo">ЯРОСЛАВ МАСЛАКОВ</div>

        <nav>
            <a href="../../../index.html">Головна</a>
            <a href="../../../articles/index.html">Статті</a>
            <a href="../../../research/index.html">Дослідження</a>
            <a href="../../../publications/index.html" class="active">Публікації</a>
            <a href="../../../certificates/index.html">Сертифікати</a>
            <a href="../../../about/index.html">Про мене</a>
            <a href="../../../contacts/index.html">Контакти</a>
        </nav>

        <button class="menu-toggle" type="button" aria-label="Відкрити меню"
            onclick="this.textContent = this.textContent === 'МЕНЮ' ? 'ЗАКРИТИ' : 'МЕНЮ'; document.querySelector('nav').classList.toggle('menu-open')">
            МЕНЮ
        </button>

        <div class="language">
            <a id="ua-link" href="../../../../uk/publications/academic/article/index.html">UA</a>
            <span>|</span>
            <a id="en-link" href="../../../../en/publications/academic/article/index.html">EN</a>
        </div>
    </div>
</header>

<main class="page">
    <div class="page-header">
        <h1 id="publication-title">Завантаження публікації...</h1>
        <p id="publication-date"></p>
    </div>

    <div class="page-content">
        <div id="publication-content" class="page-card">
            <p>Завантаження тексту публікації...</p>
        </div>

        <p>
            <a href="../index.html">← До академічних публікацій</a>
        </p>
    </div>
</main>

<footer>
    © 2026 Ярослав Маслаков
</footer>

<script>
    const menuButton = document.querySelector('.menu-toggle');
    const menu = document.querySelector('nav');

    document.addEventListener('click', function(event) {
        if (!menuButton || !menu) return;

        if (!menu.contains(event.target) && !menuButton.contains(event.target)) {
            menu.classList.remove('menu-open');
            menuButton.textContent = 'МЕНЮ';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://jtplvfweyguheyqyewal.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jAg0mG8Pj30tCF7qND3ydQ_-WDv4EhP";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text ?? "";
        return div.innerHTML;
    }

    async function loadPublication() {
        const params = new URLSearchParams(window.location.search);
        const publicationId = params.get("id");

        const titleElement = document.getElementById("publication-title");
        const dateElement = document.getElementById("publication-date");
        const contentElement = document.getElementById("publication-content");

        if (!publicationId) {
            titleElement.textContent = "Публікацію не знайдено";
            contentElement.innerHTML =
                "<p>Не вказано ідентифікатор публікації.</p>";
            return;
        }

        const { data, error } = await supabaseClient
            .from("publications")
            .select("*")
            .eq("id", publicationId)
            .eq("status", "published")
            .eq("publication_type", "academic")
            .maybeSingle();

        if (error) {
            console.error("Помилка завантаження публікації:", error);
            titleElement.textContent = "Помилка завантаження";
            contentElement.innerHTML =
                "<p>Не вдалося завантажити публікацію.</p>";
            return;
        }

        if (!data) {
            titleElement.textContent = "Публікацію не знайдено";
            contentElement.innerHTML =
                "<p>Публікація не існує або недоступна.</p>";
            return;
        }

        document.title =
            (data.title_ua || "Академічна публікація") +
            " — Ярослав Маслаков";

        titleElement.textContent =
            data.title_ua || "Без назви";

        if (data.publication_date) {
            const date = new Date(data.publication_date + "T00:00:00");

            dateElement.textContent = isNaN(date.getTime())
                ? data.publication_date
                : date.toLocaleDateString("uk-UA", {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });
        } else {
            dateElement.textContent = "";
        }

        contentElement.innerHTML = `
            <p>${escapeHtml(data.description_ua || "")}</p>
            ${
                data.url
                    ? `<p><a href="${escapeHtml(data.url)}" target="_blank" rel="noopener noreferrer">Читати оригінал публікації ↗</a></p>`
                    : ""
            }
        `;

        document.getElementById("ua-link").href =
            `../../../../uk/publications/academic/article/index.html?id=${encodeURIComponent(data.id)}`;

        document.getElementById("en-link").href =
            `../../../../en/publications/academic/article/index.html?id=${encodeURIComponent(data.id)}`;
    }

    loadPublication();
</script>

</body>
</html>
