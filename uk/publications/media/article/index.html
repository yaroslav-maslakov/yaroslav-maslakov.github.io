        <button class="menu-toggle" type="button" aria-label="Відкрити меню"
            onclick="this.textContent = this.textContent === 'МЕНЮ' ? 'ЗАКРИТИ' : 'МЕНЮ'; document.querySelector('nav').classList.toggle('menu-open')">МЕНЮ</button>

<script>
    const menuButton = document.querySelector('.menu-toggle');
    const menu = document.querySelector('nav');

    document.addEventListener('click', function(event) {
        if (!menuButton || !menu) return;

        if (!menu.contains(event.target) && !menuButton.contains(event.target)) {
            menu.classList.remove('menu-open');
            menuButton.textContent = 'МЕНЮ';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://jtplvfweyguheyqyewal.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jAg0mG8Pj30tCF7qND3ydQ_-WDv4EhP";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    async function loadPublication() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        const titleElement = document.getElementById("publication-title");
        const dateElement = document.getElementById("publication-date");
        const descriptionElement = document.getElementById("publication-description");
        const linkElement = document.getElementById("original-link");
        const errorElement = document.getElementById("error-message");

        if (!id) {
            titleElement.textContent = "Публікацію не знайдено";
            errorElement.textContent = "У посиланні відсутній ідентифікатор матеріалу.";
            return;
        }

        const { data, error } = await supabaseClient
            .from("publications")
            .select("*")
            .eq("id", id)
            .eq("status", "published")
            .eq("publication_type", "media")
            .single();

        if (error || !data) {
            console.error("Помилка завантаження публікації:", error);
            titleElement.textContent = "Не вдалося відкрити публікацію";
            errorElement.textContent = "Перевірте посилання або спробуйте пізніше.";
            return;
        }

        document.title = (data.title_ua || "Публікація") + " — Ярослав Маслаков";
        titleElement.textContent = data.title_ua || "Без назви";

        if (data.publication_date) {
            const date = new Date(data.publication_date);
            dateElement.textContent = isNaN(date.getTime())
                ? data.publication_date
                : date.toLocaleDateString("uk-UA");
        }

        descriptionElement.textContent = data.description_ua || "";

        if (data.url) {
            const link = document.createElement("a");
            link.href = data.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Читати оригінал публікації";
            linkElement.appendChild(link);
        }
    }

    loadPublication();
</script>

</body>
</html>
